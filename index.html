const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)});
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate=s=>{if(!s)return'';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'long',day:'numeric'})};
const fmtShort=s=>{if(!s)return'';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'})};
const fmtYear=s=>{if(!s)return'';const [y,m,d]=s.split('-').map(Number);if(!yearOk(s))return `${d} ${new Date(2000,m-1,1).toLocaleDateString(undefined,{month:'short'})} ${String(y).padStart(4,'0')}`;return new Date(y,m-1,d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})};
const yearOf=s=>Number(String(s||'').split('-')[0]);
const yearOk=s=>{const y=yearOf(s);return y>=2000&&y<=2100};
const fixYear=s=>{if(!s)return s;const [y,m,d]=String(s).split('-');const n=Number(y);if(n>=0&&n<100)return `${2000+n}-${m}-${d}`;return s};

function explain(msg){msg=String(msg||'');let hint='';
  if(/schema cache|does not exist|Could not find/i.test(msg))hint='The database is missing something the site expects. Run the latest supabase-setup.sql in the Supabase SQL Editor, wait ten seconds, and reload.';
  else if(/permission denied|row-level security|violates row-level/i.test(msg))hint='The database refused this request. Sign out and back in; if it persists, run the latest supabase-setup.sql again.';
  else if(/Failed to fetch|NetworkError|Load failed/i.test(msg))hint='The browser could not reach Supabase. Check the project URL in CONFIG, and that the project is not paused.';
  return hint}
const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){console.error(e);const h=explain(e.message);toast('Could not save: '+(e.message||e));if(h)setTimeout(()=>alert((e.message||e)+'\n\n'+h),50)}};
function showError(e){console.error(e);app.innerHTML=`<div class="entry card"><h1>Something went wrong</h1><p class="muted">${esc(e.message||e)}</p>${explain(e.message)?`<p class="note small">${esc(explain(e.message))}</p>`:''}<p class="row"><a class="btn ghost" href="#/">Back to start</a><a class="btn ghost" href="#/admin">Dashboard</a></p></div>`}
async function route(){
  const h=(location.hash&&location.hash.length>1?location.hash:CUR)||'#/';CUR=h;
  const path=h.slice(1).split('?')[0];
  window.scrollTo({top:0});stopRefresh();
  try{
    if(!configured()&&!MOCKED){renderSetup();return}
    if(path==='/client')return renderClientLogin();
    if(path==='/calendar')return await renderCalendar();
    if(path==='/astrologer')return await renderAstrologerLogin();
    if(path.startsWith('/admin'))return await renderAdmin(path);
    renderHome();
  }catch(e){showError(e)}
}

function monthHint(list,y,m,onJump){
  const ym=`${y}-${String(m+1).padStart(2,'0')}`;
  const inMonth=list.some(i=>i.start_date.slice(0,7)<=ym&&i.end_date.slice(0,7)>=ym);
  if(inMonth||!list.length)return '';
  const later=list.filter(i=>i.start_date.slice(0,7)>ym).sort((a,b)=>a.start_date<b.start_date?-1:1)[0];
  const earlier=list.filter(i=>i.end_date.slice(0,7)<ym).sort((a,b)=>a.end_date<b.end_date?1:-1)[0];
  const tgt=later||earlier;if(!tgt)return '';
  const d=later?later.start_date:earlier.end_date;
  return `<p class="note small" style="margin:0 0 12px">Nothing in this month. ${later?'Next':'Most recent'}: “${esc(tgt.title)}” on ${fmtDate(d)}. <button type="button" class="btn ghost small" data-jump="${d.slice(0,7)}">Go there</button></p>`;
}

function drawCalendar(pkg,root,opts={}){
  const ent={...ENT_DEFAULT,...(pkg.entitlements||{})};
  const prefs=Object.assign({mode:'everything',hidden:[],intention:''},pkg.prefs||{});
  if(Array.isArray(prefs.cats)){prefs.hidden=CATEGORIES.map(c=>c[0]).filter(k=>!prefs.cats.includes(k));delete prefs.cats}
  if(!ent.intentions)prefs.intention='';
  const shown=k=>!prefs.hidden.includes(k);
  const savePrefs=()=>{pkg.prefs=prefs;if(opts.code&&!opts.preview)api.setPrefs(opts.code,prefs).catch(()=>{})};
  const visible=(pkg.influences||[]).filter(i=>{
    if(prefs.mode==='essential'&&!(i.significant||i.intensity>=4))return false;
    if(prefs.mode==='supportive'&&i.polarity!=='supportive')return false;
    if(prefs.mode==='caution'&&!(i.polarity==='caution'||i.polarity==='especially_sensitive'))return false;
    if(!shown(i.category))return false;
    if(prefs.intention){const rel=INTENTIONS[prefs.intention]||[];if(!(i.significant||rel.includes(i.category)||(i.secondary_categories||[]).some(c=>rel.includes(c))))return false}
    return true});
  const y=calState.year,m=calState.month;const first=new Date(y,m,1);const startDow=first.getDay();const dim=new Date(y,m+1,0).getDate();
  const monthName=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow" aria-hidden="true">${d}</div>`).join('');
  let cells='';const total=Math.ceil((startDow+dim)/7)*7;
  for(let k=0;k<total;k++){
    const dnum=k-startDow+1;const dt=new Date(y,m,dnum);const ds=ymd(dt);const other=dnum<1||dnum>dim;
    const here=visible.filter(i=>i.start_date<=ds&&ds<=i.end_date);
    const longs=here.filter(i=>i.start_date!==i.end_date&&!i.parent_id).slice(0,2);
    const points=here.filter(i=>i.start_date===i.end_date||i.parent_id);
    const dominant=points[0];
    const ordered=[...points,...here.filter(i=>!points.includes(i))];
    const mk=i=>{const ic=icon(POLARITY[i.polarity].shape,POLARITY[i.polarity].color);const par=i.parent_id&&(pkg.influences||[]).find(x=>x.id===i.parent_id);return par?`<span class="win" style="border-color:${POLARITY[par.polarity].color}" title="Window within “${esc(par.title)}”">${ic}</span>`:ic};

function drawDay(pkg,visible,ds,root){

  const block=i=>{const p=POLARITY[i.polarity];const dur=i.start_date===i.end_date?fmtShort(i.start_date):`${fmtShort(i.start_date)} – ${fmtShort(i.end_date)}`;const parent=i.parent_id&&(pkg.influences||[]).find(x=>x.id===i.parent_id);

    ${(()=>{const kids=(pkg.influences||[]).filter(x=>x.parent_id===i.id).sort((a,b)=>a.start_date<b.start_date?-1:1);return kids.length?`<div class="sec"><h5>Windows within this period</h5><div class="row" style="gap:5px">${kids.map(k=>`<button type="button" class="tag winlink" data-goto="${k.start_date}" title="${esc(k.title)}">${icon(POLARITY[k.polarity].shape,POLARITY[k.polarity].color,11)} ${fmtShort(k.start_date)}${k.end_date!==k.start_date?' – '+fmtShort(k.end_date):''}${k.start_date===ds?' · today':''}</button>`).join('')}</div></div>`:''})()}
    ${sec('What you may notice',i.observation_prompt)}
    ${sec('Consider',i.reflection_prompt)}

   </article>`};

/* ICS */
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m)}
function icsTitle(i){const cat=CAT[i.category]||'General';const p={supportive:'Supportive window',caution:'Allow extra care',mixed:'Variable conditions',especially_sensitive:'Important to review'}[i.polarity];return i.category==='rest'?'Rest and restoration period':`${p}: ${cat}`}
function buildICS(pkg,opts){
  const dt=s=>s.replace(/-/g,'');
  const addDay=s=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+1)).replace(/-/g,'')};
  const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Atelier Sonnentau//Calendar//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Atelier Sonnentau — '+icsEscape(pkg.name)];
  const list=(pkg.influences||[]).filter(i=>i.calendar_sync_enabled!==false).filter(i=>{
    if(opts.polarities.length&&!opts.polarities.includes(i.polarity)&&!(opts.significant&&i.significant))return false;
    if(opts.categories.length&&!opts.categories.includes(i.category))return false;return true});
  for(const i of list){
    out.push('BEGIN:VEVENT',`UID:${i.id}@sonnentau`,`DTSTAMP:${dt(todayStr())}T000000Z`);
    if(opts.exactTimes&&i.start_time){const tz=i.timezone||'UTC';out.push(`DTSTART;TZID=${tz}:${dt(i.start_date)}T${t5(i.start_time).replace(':','')}00`,`DTEND;TZID=${tz}:${dt(i.end_date)}T${t5(i.end_time||i.start_time).replace(':','')}00`)}
    else out.push(`DTSTART;VALUE=DATE:${dt(i.start_date)}`,`DTEND;VALUE=DATE:${addDay(i.end_date)}`);
    out.push(`SUMMARY:${icsEscape(icsTitle(i))}`);
    let desc=i.client_interpretation||'';if(opts.reminders&&i.recommended_actions)desc+='\n\nConsider: '+lines(i.recommended_actions).join('; ');
    out.push(`DESCRIPTION:${icsEscape(desc)}`,`CATEGORIES:${icsEscape(CAT[i.category]||'General')}`,'END:VEVENT');
  }
  out.push('END:VCALENDAR');return out.join('\r\n');
}

async function runInfluenceDiagnostics(c){
  const out=$('#idiagout');out.innerHTML='<p class="loading">Checking…</p>';const rows=[];
  const t=async(name,fn)=>{try{const r=await fn();rows.push([true,name,r===undefined?'ok':String(r)])}catch(e){rows.push([false,name,e.message||String(e)])}};
  const id=uuid(),today=todayStr();
  await t('Client record readable',async()=>{const x=await api.getClient(c.id);return x.name+' · '+x.access_code+' · status '+x.status});
  await t('Create a test influence',async()=>{const r=await api.saveInfluence({...blankInfluence(c.id),id,title:'Connection test',intensity:1,category:'general',client_interpretation:'Test entry — will be removed.',published:true,start_date:today,end_date:today});return 'saved '+r.id.slice(0,8)+' for '+today});
  await t('Read it back in your list',async()=>{const l=await api.listInfluences(c.id);const hit=l.find(i=>i.id===id);if(!hit)throw new Error('saved, but not returned in the list ('+l.length+' influences returned)');return 'present ('+l.length+' influences in total)'});
  await t('Visible in the client’s own view',async()=>{const pkg=await api.openCalendar(c.access_code,true);if(!pkg.ok)throw new Error(pkg.why);const hit=(pkg.influences||[]).find(i=>i.id===id);if(!hit)throw new Error('client view returned '+pkg.influences.length+' influences but not the test one');return 'present ('+pkg.influences.length+' published for this client)'});
  await t('Client can open with their code',async()=>{const pkg=await api.openCalendar(c.access_code,false);return pkg.ok?'yes':'no — '+pkg.why});
  await t('Remove the test influence',async()=>{await api.deleteInfluence(id);return 'removed'});
  out.innerHTML=`<div class="card" style="margin-top:8px;background:var(--surface-2);box-shadow:none"><h3>Calendar check — ${esc(c.name)}</h3><table><tbody>${rows.map(([ok,n,m])=>`<tr><td>${ok?'✓':'✗'}</td><td>${esc(n)}</td><td class="small" style="${ok?'color:var(--muted)':'color:var(--sensitive)'}">${esc(m)}</td></tr>`).join('')}</tbody></table>
   <p class="small muted" style="margin-top:8px">${rows.every(r=>r[0])?'Saving and reading influences works for this client. If one you added is still missing, check its dates (the calendar shows one month at a time) and whether it was saved as a draft.':'The red line is the step that fails. '+esc(explain(rows.find(r=>!r[0])[2])||'')}</p></div>`;
}
async function renderWorkspace(id){
  if(wsClient!==id){wsClient=id;wsTab='client'}
  let c;try{c=await api.getClient(id)}catch(e){go('#/admin');return}
  const [influences,templates]=await Promise.all([api.listInfluences(id),api.listTemplates()]);
  const ctx={c,influences,templates,reload:()=>renderWorkspace(id)};
  const tabs=[['client','Client & access'],['natal','Natal & Jyotish'],['calendar','Calendar'],['influences','Influences'],['preview','Client preview']];
  app.innerHTML=`<p class="crumbs"><a href="#/admin">Clients</a> › Workspace</p><h1 style="margin:0">${esc(c.name||'Unnamed')}</h1>
   <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${wsTab===k}" data-tab="${k}">${l}</button>`).join('')}</div><div id="tabbody"></div>`;
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{wsTab=b.dataset.tab;renderWorkspace(id)});
  const body=$('#tabbody');
  ({client:tabClient,natal:tabNatal,calendar:tabCalendar,influences:tabInfluences,preview:tabPreview})[wsTab](ctx,body);
}

function tabCalendar(ctx,body){
  const {c,influences}=ctx;const y=wsCal.year,m=wsCal.month;const first=new Date(y,m,1);const startDow=first.getDay();const dim=new Date(y,m+1,0).getDate();
  let cells='';const total=Math.ceil((startDow+dim)/7)*7;
  for(let k=0;k<total;k++){const dnum=k-startDow+1;const dt=new Date(y,m,dnum);const ds=ymd(dt);const other=dnum<1||dnum>dim;
    const here=influences.filter(i=>i.start_date<=ds&&ds<=i.end_date);
    const marks=here.map(i=>`<span title="${esc(i.title)}" style="opacity:${i.published?1:.35}">${icon(POLARITY[i.polarity].shape,POLARITY[i.polarity].color)}</span>`).slice(0,5).join('')+(here.length>5?`<span class="more">+${here.length-5}</span>`:'');
    cells+=`<button type="button" class="day${other?' other':''}${ds===todayStr()?' today':''}" data-d="${ds}" aria-label="${esc(fmtDate(ds))}, ${here.length} influences"><span class="num">${dt.getDate()}</span><span class="marks">${marks}</span></button>`}
  const ym=`${y}-${String(m+1).padStart(2,'0')}`;
  const outside=influences.filter(i=>!(i.start_date.slice(0,7)<=ym&&i.end_date.slice(0,7)>=ym));
  const outsideNote=outside.length&&influences.length!==outside.length?`<p class="small muted" style="margin:10px 0 0">${outside.length} influence${outside.length>1?'s':''} outside this month: ${outside.slice(0,6).map(i=>`${esc(i.title)} (${fmtYear(i.start_date)})`).join(' · ')}${outside.length>6?' …':''}</p>`:'';
  body.innerHTML=`<div class="card">${monthHint(influences,y,m)}<div class="cal-head"><button type="button" class="btn ghost small" id="p" aria-label="Previous month">&larr;</button><h2>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button type="button" class="btn ghost small" id="n" aria-label="Next month">&rarr;</button></div>
   <div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
   <p class="small muted" style="margin:10px 0 0">Faded markers are drafts (not visible to the client). Select a day to see what is on it.</p>${outsideNote}
   <div id="adminday"></div>
</div>`;
  bindJump(body,(yy,mm)=>{wsCal.year=yy;wsCal.month=mm;ctx.reload()});
  $('#p').onclick=()=>{wsCal.month--;if(wsCal.month<0){wsCal.month=11;wsCal.year--}ctx.reload()};
  $('#n').onclick=()=>{wsCal.month++;if(wsCal.month>11){wsCal.month=0;wsCal.year++}ctx.reload()};
  body.querySelectorAll('.day').forEach(b=>b.onclick=()=>{const ds=b.dataset.d;body.querySelectorAll('.day').forEach(x=>x.classList.toggle('sel',x.dataset.d===ds));
    const here=influences.filter(i=>i.start_date<=ds&&ds<=i.end_date);
    $('#adminday',body).innerHTML=`<div class="card" style="margin-top:12px;background:var(--surface-2);box-shadow:none"><div class="row between"><h3 style="margin:0">${fmtDate(ds)}</h3><button type="button" class="btn small" id="addhere">Add influence on this day</button></div>
      ${here.length?`<ul class="list" style="margin-top:10px">${here.map(i=>`<li><div>${icon(POLARITY[i.polarity].shape,POLARITY[i.polarity].color)} <strong>${esc(i.title)}</strong> <span class="small muted">${fmtYear(i.start_date)}${i.end_date!==i.start_date?' – '+fmtYear(i.end_date):''} · ${esc(CAT[i.category]||i.category)}</span> <span class="pill ${i.published?'supportive':'draft'}">${i.published?'Published':'Draft'}</span></div><button type="button" class="btn ghost small" data-edit="${i.id}">Edit</button></li>`).join('')}</ul>`:'<p class="small muted" style="margin:8px 0 0">Nothing on this day.</p>'}</div>`;
    $('#addhere',body).onclick=()=>{const i=blankInfluence(c.id);i.start_date=i.end_date=ds;openEditor(ctx,i,true)};
    body.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>openEditor(ctx,influences.find(i=>i.id===x.dataset.edit),false));});
}

  polarity:'supportive',significant:false,intensity:'',category:'',secondary_categories:[],client_interpretation:'',observation_prompt:'',reflection_prompt:'',recommended_actions:'',avoidances:'',prediction:'',remedial_note:'',disclaimer:'none',custom_disclaimer:'',

function tabInfluences(ctx,body){
  const {c,influences,templates}=ctx;const all=[...influences].sort((a,b)=>a.start_date<b.start_date?-1:1);
  const ent={...ENT_DEFAULT,...(c.entitlements||{})};
  const sees=i=>!i.published?['No','draft — open and choose Review and publish']:(i.category==='remedies'&&!ent.remedial)?['No','remedial add-on is off for this client']:['Yes',''];
  const row=i=>{const [v,why]=sees(i);return `<tr><td>${icon(POLARITY[i.polarity].shape,POLARITY[i.polarity].color)} ${i.significant?icon('star','var(--significant)'):''}</td><td><strong>${esc(i.title||'Untitled')}</strong>${i.parent_id?`<div class="small muted">within “${esc(all.find(x=>x.id===i.parent_id)?.title||'')}”</div>`:''}</td><td>${fmtYear(i.start_date)}${i.end_date!==i.start_date?' – '+fmtYear(i.end_date):''}${yearOk(i.start_date)&&yearOk(i.end_date)?'':'<div><span class="pill especially_sensitive">year looks wrong — not on the calendar</span></div>'}</td><td>${esc(CAT[i.category]||i.category)}</td><td>${i.intensity}</td><td><span class="pill ${i.published?'supportive':'draft'}">${i.published?'Published':'Draft'}</span></td><td><span class="pill ${v==='Yes'?'supportive':'caution'}">${v}</span>${why?`<div class="small muted">${esc(why)}</div>`:''}</td><td><button type="button" class="btn ghost small" data-edit="${i.id}">Edit</button></td></tr>`};
  const badYears=all.filter(i=>!yearOk(i.start_date)||!yearOk(i.end_date));
  const fixable=badYears.filter(i=>yearOk(fixYear(i.start_date))&&yearOk(fixYear(i.end_date)));
  const yearBanner=badYears.length?`<p class="warn" style="margin:0 0 12px">${badYears.length} influence${badYears.length>1?'s have':' has'} a year that cannot be right (e.g. ${String(yearOf(badYears[0].start_date)).padStart(4,'0')} instead of ${new Date().getFullYear()}), so ${badYears.length>1?'they do':'it does'} not appear on any calendar. This happens when a date is typed with a two-digit year. ${fixable.length?`<button type="button" class="btn small" id="fixyears">Correct ${fixable.length===badYears.length?'them':fixable.length+' of them'} to 20xx</button>`:''}${fixable.length<badYears.length?' The others need editing by hand.':''}</p>`:'';
  body.innerHTML=`<div class="card">${yearBanner}<div class="row between"><h2 style="margin:0">Influences</h2><div class="row"><select id="tpl"><option value="">Insert from template…</option>${templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button type="button" class="btn" id="newi">New influence</button></div></div>
   <label class="f"><span>Search</span><input type="text" id="q" placeholder="Title, category, note…"></label>
   <div style="overflow:auto"><table><thead><tr><th></th><th>Title</th><th>Dates</th><th>Category</th><th>Int.</th><th>Status</th><th>Client sees</th><th></th></tr></thead><tbody id="rows">${all.map(row).join('')||'<tr><td colspan="8" class="muted">No influences yet.</td></tr>'}</tbody></table></div>
   <h3 style="margin-top:18px">Drafts (${all.filter(i=>!i.published).length})</h3><p class="small muted">${all.filter(i=>!i.published).map(i=>esc(i.title)).join(' · ')||'None'}${all.some(i=>!i.published)?' — drafts are never shown to the client.':''}</p>
   <p class="small muted" style="margin-top:14px"><button type="button" class="btn quiet small" id="idiag">Check this client’s calendar</button> <span>— creates a test influence, confirms it can be read back by you and by the client, then removes it.</span></p><div id="idiagout"></div></div>`;
  $('#idiag').onclick=()=>runInfluenceDiagnostics(c);
  const fy=$('#fixyears');if(fy)fy.onclick=guard(async()=>{fy.disabled=true;for(const i of fixable)await api.saveInfluence({...i,start_date:fixYear(i.start_date),end_date:fixYear(i.end_date)});toast('Dates corrected');ctx.reload()});
  $('#newi').onclick=()=>openEditor(ctx,blankInfluence(c.id),true);
  $('#tpl').onchange=e=>{const t=templates.find(x=>x.id===e.target.value);if(!t)return;const i=Object.assign(blankInfluence(c.id),{title:t.name},t.data||{});openEditor(ctx,i,true)};
  const bind=()=>body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(ctx,influences.find(i=>i.id===b.dataset.edit),false));bind();
  $('#q').oninput=e=>{const q=e.target.value.toLowerCase();$('#rows').innerHTML=all.filter(i=>JSON.stringify(i).toLowerCase().includes(q)).map(row).join('');bind()};
}

   <div id="review"></div>
   <div class="row between" style="margin-top:14px">
    <div class="row"><button class="btn ghost" type="button" id="savedraft">Save as draft</button><button class="btn" type="button" id="publish">${inf.published?'Save and keep published':'Review and publish'}</button>${inf.published?'<button class="btn ghost" type="button" id="unpub">Unpublish</button>':''}<button class="btn quiet" type="button" id="astemplate">Save as template</button></div>
    ${isNew?'':'<button class="btn quiet" type="button" id="del">Delete</button>'}
   </div></form></div>`;
  document.body.appendChild(dlg);dlg.showModal();
  const form=$('#ef',dlg);
  const collect=()=>{const f=new FormData(form);const o={};const j=inf.jyotish||{},s=inf.source_reference||{};const secs=[],sup=[],dif=[];
    for(const [k,v] of f){if(k==='sec')secs.push(v);else if(k==='sup')sup.push(v);else if(k==='dif')dif.push(v);else if(k.startsWith('j:'))j[k.slice(2)]=v;else if(k.startsWith('s:'))s[k.slice(2)]=v;else o[k]=v}
    o.supportive_for=o.polarity==='mixed'?sup:[];o.difficult_for=o.polarity==='mixed'?dif:[];
    for(const cb of ['significant','show_prediction','show_exact_time','show_technical_basis','calendar_sync_enabled'])o[cb]=form.elements[cb].checked;
    o.intensity=o.intensity===''?'':Math.min(5,Math.max(1,Number(o.intensity)||1));o.secondary_categories=secs.filter(x=>x!==o.category);o.jyotish=j;o.source_reference=s;o.parent_id=o.parent_id||null;
    o.start_date=fixYear(o.start_date);o.end_date=fixYear(o.end_date);
    if(o.end_date<o.start_date)o.end_date=o.start_date;return o};
  const datesOk=()=>{const o=collect();if(!yearOk(o.start_date)||!yearOk(o.end_date)){alert(`The year in the dates looks wrong (${yearOf(o.start_date)}). Please enter a four-digit year such as ${new Date().getFullYear()}.`);return false}return true};
  const updateSig=()=>{const o=collect();const p=POLARITY[o.polarity];$('#sigpreview',dlg).innerHTML=`Marker: ${icon(p.shape,p.color)} <strong>${p.label}</strong> · ${p.hint}${o.category?` · Category accent <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cat-${o.category})"></span> ${esc(CAT[o.category])}`:' · <em>choose a category</em>'}${o.significant?' · '+icon('star','var(--significant)')+' significant':''}${o.category==='remedies'?' · <em>visible only to clients with the remedial add-on</em>':''}`};
  form.addEventListener('input',()=>{updateSig();$('#mixedareas',dlg).classList.toggle('hidden',form.elements.polarity.value!=='mixed')});updateSig();
  const review=()=>{const o=collect();const fields={Title:o.title,Interpretation:o.client_interpretation,Notice:o.observation_prompt,Consider:o.reflection_prompt,Act:o.recommended_actions,Postpone:o.avoidances,Prediction:o.prediction,Remedial:o.remedial_note};
    const hits=Object.entries(fields).map(([k,v])=>[k,langCheck(v)]).filter(([,h])=>h.length);
    const missing=[];if(!o.client_interpretation)missing.push('an interpretation');if(o.category==='health'&&!['health','custom'].includes(o.disclaimer))missing.push('a health boundary disclaimer');if(o.category==='legal'&&!['legal','custom'].includes(o.disclaimer))missing.push('a legal disclaimer');if(o.category==='money'&&!['financial','custom'].includes(o.disclaimer))missing.push('a financial disclaimer');if((o.category==='remedies'||o.remedial_note)&&!['remedy','custom'].includes(o.disclaimer))missing.push('the remedy disclaimer');
    if(o.polarity==='especially_sensitive'&&!o.reflection_prompt)missing.push('a reflection prompt (recommended for especially sensitive periods)');
    const p=POLARITY[o.polarity];
    $('#review',dlg).innerHTML=`<div class="card" style="background:var(--surface-2);box-shadow:none"><h3>Pre-publication review</h3>
     <div class="row"><span class="pill ${o.polarity}">${icon(p.shape,p.color,12)} ${p.label}</span>${o.significant?`<span class="pill significant">Especially significant</span>`:''}<span class="tag">${esc(CAT[o.category])}</span><span class="tag">Intensity ${o.intensity}</span><span class="tag">token: ${o.polarity} / ${p.shape}</span><span class="tag">aria: ${esc(o.accessibility_label||`${p.label}: ${CAT[o.category]}`)}</span></div>
     ${hits.length?`<div class="warn" style="margin-top:8px"><strong>Language check:</strong> possibly deterministic or alarmist wording — ${hits.map(([k,h])=>`${k}: “${h.map(esc).join('”, “')}”`).join('; ')}. Consider softening (“may”, “consider”, “allow extra care”).</div>`:`<div class="ok" style="margin-top:8px">Language check: no deterministic or alarmist phrases detected.</div>`}
     ${missing.length?`<div class="warn" style="margin-top:8px">Consider adding ${missing.join(', ')}.</div>`:''}
     <h4 style="margin-top:12px">Client will see</h4><div id="pvblock"></div>
     <p class="row"><button class="btn" type="button" id="confirmpub">Publish now</button><button class="btn ghost" type="button" id="backedit">Keep editing</button></p></div>`;
    const proj={...o,id:inf.id,supportive_for:o.supportive_for,difficult_for:o.difficult_for,start_time:o.show_exact_time?o.start_time:'',end_time:o.show_exact_time?o.end_time:'',prediction:o.show_prediction?o.prediction:'',technical_basis:o.show_technical_basis?o.technical_basis:'',custom_disclaimer:o.disclaimer==='custom'?o.custom_disclaimer:''};
    const stub=document.createElement('div');stub.innerHTML='<div id="daypanel"></div>';drawDay({influences:[proj],default_disclaimer:'none'},[proj],o.start_date,stub);$('#pvblock',dlg).innerHTML=stub.querySelector('.inf')?.outerHTML||'';
    $('#review',dlg).scrollIntoView({behavior:'smooth'});
    $('#confirmpub',dlg).onclick=()=>persist(true,'Published');$('#backedit',dlg).onclick=()=>{$('#review',dlg).innerHTML=''}};
  const busy=on=>dlg.querySelectorAll('button').forEach(b=>b.disabled=on);
  const persist=async(pub,msg)=>{busy(true);try{const o={...inf,...collect(),published:pub};await api.saveInfluence(o);dlg.close();dlg.remove();toast(msg);ctx.reload()}catch(e){busy(false);alert('Could not save: '+e.message)}};
  $('#savedraft',dlg).onclick=()=>{if(!form.reportValidity()||!datesOk())return;persist(false,'Draft saved — not visible to the client until published')};
  $('#publish',dlg).onclick=()=>{if(!form.reportValidity()||!datesOk())return;review()};
  const un=$('#unpub',dlg);if(un)un.onclick=()=>persist(false,'Unpublished');
  $('#astemplate',dlg).onclick=guard(async()=>{const o=collect();const name=prompt('Template name:',o.title);if(!name)return;const data={};for(const k of ['category','polarity','intensity','client_interpretation','observation_prompt','reflection_prompt','recommended_actions','avoidances','disclaimer','remedial_note','private_notes'])data[k]=o[k];await api.saveTemplate({id:uuid(),name,data});toast('Template saved');ctx.templates=await api.listTemplates()});
  const del=$('#del',dlg);if(del)del.onclick=guard(async()=>{if(confirm('Delete this influence? Windows within it will be kept but unlinked.')){busy(true);try{await api.deleteInfluence(inf.id)}catch(e){busy(false);throw e}dlg.close();dlg.remove();ctx.reload()}});
  $('#close',dlg).onclick=()=>{dlg.close();dlg.remove()};
  dlg.addEventListener('cancel',()=>dlg.remove());
}

/* ---------------- Templates ---------------- */
async function renderTemplates(){
  const templates=await api.listTemplates();
  app.innerHTML=`<p class="crumbs"><a href="#/admin">Clients</a> › Templates</p><div class="row between" style="margin-bottom:14px"><h1 style="margin:0">Templates</h1><div class="row">${templates.length?'':'<button type="button" class="btn ghost" id="starter">Add starter templates</button>'}<button type="button" class="btn" id="newt">New template</button></div></div>
   <div class="card"><ul class="list">${templates.map(t=>{const d=t.data||{};const p=POLARITY[d.polarity]||POLARITY.supportive;return `<li><div><a href="#/admin/templates" data-e="${t.id}">${esc(t.name)}</a><div class="small muted">${icon(p.shape,p.color)} ${p.label} · ${esc(CAT[d.category]||d.category||'General')} · intensity ${d.intensity||3}</div></div><div class="row"><button type="button" class="btn ghost small" data-e="${t.id}">Edit</button><button type="button" class="btn quiet small" data-d="${t.id}">Delete</button></div></li>`}).join('')||'<li class="muted">No templates yet.</li>'}</ul></div>`;
  const edit=t=>{const d=t.data||{};const dlg=document.createElement('dialog');
    dlg.innerHTML=`<div class="dh"><h2 style="margin:0">Template</h2><button type="button" class="btn quiet small" id="x" aria-label="Close">✕</button></div><div class="db"><form id="tf">${fld('Name','name',t.name,'text','required')}
     <div class="grid3"><label class="f"><span>Default polarity</span>${sel('polarity',Object.entries(POLARITY).map(([k,p])=>[k,p.label]),d.polarity||'supportive')}</label><label class="f"><span>Default category</span>${sel('category',CATEGORIES,d.category||'general')}</label><label class="f"><span>Default intensity</span><input type="number" name="intensity" min="1" max="5" value="${d.intensity||3}"></label></div>
     ${txt('Interpretation','client_interpretation',d.client_interpretation)}${txt('Notice prompt','observation_prompt',d.observation_prompt)}${txt('Consider prompt','reflection_prompt',d.reflection_prompt)}${txt('Act prompt','recommended_actions',d.recommended_actions)}${txt('Caution / postpone language','avoidances',d.avoidances)}${txt('Remedial note','remedial_note',d.remedial_note)}
     <label class="f"><span>Default disclaimer</span>${sel('disclaimer',Object.keys(DISCLAIMERS).map(k=>[k,k]),d.disclaimer||'none')}</label>${txt('Private Jyotish rationale','private_notes',d.private_notes)}
     <p><button class="btn" type="submit">Save template</button></p></form></div>`;
    document.body.appendChild(dlg);dlg.showModal();$('#x',dlg).onclick=()=>{dlg.close();dlg.remove()};dlg.addEventListener('cancel',()=>dlg.remove());
    $('#tf',dlg).onsubmit=guard(async e=>{e.preventDefault();const data={};let name='';for(const [k,v] of new FormData(e.target)){if(k==='name')name=v;else data[k]=k==='intensity'?Number(v):v}await api.saveTemplate({id:t.id||uuid(),name,data});dlg.close();dlg.remove();toast('Template saved');renderTemplates()})};
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=e=>{e.preventDefault();edit(templates.find(t=>t.id===b.dataset.e))});
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=guard(async()=>{if(confirm('Delete this template?')){await api.deleteTemplate(b.dataset.d);renderTemplates()}}));
  $('#newt').onclick=()=>edit({name:'',data:{}});
  const st=$('#starter');if(st)st.onclick=guard(async()=>{st.disabled=true;try{for(const t of STARTER_TEMPLATES)await api.saveTemplate({id:uuid(),name:t.name,data:t.data})}catch(e){st.disabled=false;throw e}toast('Starter templates added');renderTemplates()});
}

/* ---------------- Boot ---------------- */
route();
</script>
</body>
</html>
