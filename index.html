const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)});
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate=s=>{if(!s)return'';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'long',day:'numeric'})};
const fmtShort=s=>{if(!s)return'';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'})};
const t5=v=>v?String(v).slice(0,5):'';
const lines=t=>String(t||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
const nn=v=>v===''||v===undefined?null:v;
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(6));for(const b of r)s+=a[b%a.length];return 'SONNENTAU-'+s}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
function icon(shape,color,size=14){
  const c=color||'currentColor';
  const m={
    circle:`<circle cx="7" cy="7" r="5.5" fill="${c}"/>`,
    diamond:`<path d="M7 1 L13 7 L7 13 L1 7 Z" fill="${c}"/>`,
    half:`<circle cx="7" cy="7" r="5.5" fill="none" stroke="${c}" stroke-width="1.6"/><path d="M7 1.5 A5.5 5.5 0 0 1 7 12.5 Z" fill="${c}"/>`,
    square:`<rect x="1.5" y="1.5" width="11" height="11" rx="1.5" fill="none" stroke="${c}" stroke-width="1.6"/><rect x="5.5" y="5.5" width="3" height="3" fill="${c}"/>`,
    star:`<path d="M7 0.5 L8.6 5.4 L13.5 7 L8.6 8.6 L7 13.5 L5.4 8.6 L0.5 7 L5.4 5.4 Z" fill="${c}"/>`
  }[shape]||'';
  return `<svg class="mark" width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true" focusable="false">${m}</svg>`;
}
function langCheck(text){const hits=[];for(const re of ALARM_WORDS){const m=String(text||'').match(re);if(m)hits.push(m[0])}return [...new Set(hits)]}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function copy(text,msg){return navigator.clipboard.writeText(text).then(()=>toast(msg||'Copied'),()=>prompt('Copy this:',text))}
const fld=(label,name,val,type='text',extra='')=>`<label class="f"><span>${label}</span><input type="${type}" name="${name}" value="${esc(val??'')}" ${extra}></label>`;
const txt=(label,name,val,hint='')=>`<label class="f"><span>${label}${hint?` <em>— ${hint}</em>`:''}</span><textarea name="${name}">${esc(val??'')}</textarea></label>`;
const sel=(name,opts,val,id='')=>`<select name="${name}" ${id?`id="${id}"`:''}>${opts.map(([k,l])=>`<option value="${k}" ${val===k?'selected':''}>${l}</option>`).join('')}</select>`;

/* ---------------- Data layer (Supabase) ---------------- */
let sb=null;
const configured=()=>/^https:\/\//.test(CONFIG.SUPABASE_URL)&&CONFIG.SUPABASE_ANON_KEY.length>20;
if(configured()&&window.supabase)sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
const chk=({data,error})=>{if(error)throw new Error(error.message||String(error));return data};
function cleanClient(c){const o={...c};delete o.created_at;delete o.updated_at;for(const k of ['birth_date','birth_time','access_start','access_end'])o[k]=nn(o[k]);o.jyotish=o.jyotish||{};o.entitlements={...ENT_DEFAULT,...(o.entitlements||{})};return o}
function cleanInfluence(i){const o={...i};delete o.created_at;delete o.updated_at;for(const k of ['start_time','end_time','parent_id'])o[k]=nn(o[k]);o.jyotish=o.jyotish||{};o.source_reference=o.source_reference||{};o.secondary_categories=o.secondary_categories||[];if(o.end_date<o.start_date)o.end_date=o.start_date;return o}
const api={
  async adminSignIn(password){
    chk(await sb.auth.signInWithPassword({email:CONFIG.ASTROLOGER_EMAIL,password}));
    if(!await api.isAdmin()){await sb.auth.signOut();throw new Error('This account is not enrolled as the astrologer. Re-run the enrolment section of supabase-setup.sql.')}
  },
  async adminSignOut(){await sb.auth.signOut()},
  async adminSession(){const {data}=await sb.auth.getSession();return data.session||null},
  async isAdmin(){return !!chk(await sb.rpc('is_admin'))},
  async listClients(){return chk(await sb.from('clients').select('*').order('name'))},
  async getClient(id){return chk(await sb.from('clients').select('*').eq('id',id).single())},
  async saveClient(c){return chk(await sb.from('clients').upsert(cleanClient(c)).select().single())},
  async deleteClient(id){chk(await sb.from('clients').delete().eq('id',id))},
  async listInfluences(clientId){return chk(await sb.from('influences').select('*').eq('client_id',clientId).order('start_date'))},
  async saveInfluence(i){return chk(await sb.from('influences').upsert(cleanInfluence(i)).select().single())},
  async deleteInfluence(id){chk(await sb.from('influences').delete().eq('id',id))},
  async listTemplates(){return chk(await sb.from('templates').select('*').order('name'))},
  async saveTemplate(t){const o={id:t.id,name:t.name,data:t.data||{}};return chk(await sb.from('templates').upsert(o).select().single())},
  async deleteTemplate(id){chk(await sb.from('templates').delete().eq('id',id))},
  async openCalendar(code,preview=false){return chk(await sb.rpc('client_open',{p_code:code,p_preview:!!preview}))},
  async setPrefs(code,prefs){return chk(await sb.rpc('client_set_prefs',{p_code:code,p_prefs:prefs}))}
};
let MOCKED=false;
if(window.__apiOverride){Object.assign(api,window.__apiOverride);MOCKED=true}

/* ---------------- Router & header ---------------- */
const app=$('#app'), hdr=$('#hdr');
const CODE_KEY='as.client_code';
let CUR='#/';
function go(h){CUR=h;try{if(location.hash!==h)location.hash=h}catch(e){}route()}
window.addEventListener('hashchange',()=>{CUR=location.hash||'#/';route()});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(a){e.preventDefault();go(a.getAttribute('href'))}});
function setHeader({left=[],brand=true,right=[]}={}){
  const links=arr=>arr.map(i=>i.id?`<button class="btn small ${i.cls||'quiet'}" id="${i.id}">${esc(i.label)}</button>`:`<a class="btn small ${i.cls||'ghost'}" href="${i.href}">${esc(i.label)}</a>`).join('');
  hdr.innerHTML=`<nav class="hl" aria-label="Sign in">${links(left)}</nav><a class="hb ${brand?'':'hidden'}" href="#/">Atelier Sonnentau<small>my astrological calendar</small></a><div class="hr">${links(right)}</div>`;
  [...left,...right].filter(i=>i.id&&i.onClick).forEach(i=>$('#'+i.id).onclick=i.onClick);
}
const signedOutNav=()=>[{href:'#/client',label:'Client login'},{href:'#/astrologer',label:'Astrologer login'}];
function showError(e){console.error(e);app.innerHTML=`<div class="entry card"><h1>Something went wrong</h1><p class="muted">${esc(e.message||e)}</p><p><a class="btn ghost" href="#/">Back to start</a></p></div>`}
async function route(){
  const h=(location.hash&&location.hash.length>1?location.hash:CUR)||'#/';CUR=h;
  const path=h.slice(1).split('?')[0];
  window.scrollTo({top:0});
  try{
    if(!configured()&&!MOCKED){renderSetup();return}
    if(path==='/client')return renderClientLogin();
    if(path==='/calendar')return await renderCalendar();
    if(path==='/astrologer')return renderAstrologerLogin();
    if(path.startsWith('/admin'))return await renderAdmin(path);
    renderHome();
  }catch(e){showError(e)}
}

/* ---------------- Client login ---------------- */
function renderClientLogin(msg){
  setHeader({left:signedOutNav(),brand:true,right:[]});
  const stored=localStorage.getItem(CODE_KEY);
  if(stored&&!msg){go('#/calendar');return}
  app.innerHTML=`<div class="entry card"><h1>Your calendar</h1><p class="muted">Enter the access code your astrologer sent you.</p>
    <form id="codeform"><label class="sr-only" for="code">Access code</label>
    <input id="code" type="text" autocomplete="off" autocapitalize="characters" placeholder="SONNENTAU-XXXXXX" required>
    <div class="err" id="cerr" role="alert">${esc(msg||'')}</div>
    <p><button class="btn" type="submit" id="codebtn">Open calendar</button></p></form></div>`;
  $('#codeform').onsubmit=async e=>{e.preventDefault();const code=$('#code').value.trim().toUpperCase();const b=$('#codebtn');b.disabled=true;$('#cerr').textContent='';
    try{const pkg=await api.openCalendar(code);if(!pkg.ok){$('#cerr').textContent=pkg.why;b.disabled=false;return}
      localStorage.setItem(CODE_KEY,code);go('#/calendar')}
    catch(err){$('#cerr').textContent='Could not reach the calendar service. '+(err.message||'');b.disabled=false}};
}
function clientSignOut(){localStorage.removeItem(CODE_KEY);go('#/')}

/* ---------------- Client calendar ---------------- */
let calState={year:new Date().getFullYear(),month:new Date().getMonth(),selected:todayStr()};
async function renderCalendar(){
  const code=localStorage.getItem(CODE_KEY);
  if(!code){go('#/client');return}
  setHeader({left:[],brand:true,right:[{id:'out',label:'Sign out',cls:'ghost',onClick:clientSignOut}]});
  app.innerHTML='<p class="loading">Opening your calendar…</p>';
  let pkg;
  try{pkg=await api.openCalendar(code)}catch(err){app.innerHTML=`<div class="entry card"><h1>Not reachable</h1><p class="muted">Could not reach the calendar service. Please try again in a moment.</p><p class="small muted">${esc(err.message||'')}</p></div>`;return}
  if(!pkg.ok){localStorage.removeItem(CODE_KEY);renderClientLogin(pkg.why);return}
  app.innerHTML=`<h1 style="margin-bottom:14px">Hello, ${esc(pkg.name)}</h1><div id="calroot"></div>`;
  drawCalendar(pkg,$('#calroot'),{code});
}
function drawCalendar(pkg,root,opts={}){
  const ent={...ENT_DEFAULT,...(pkg.entitlements||{})};
  const prefs=Object.assign({mode:'everything',cats:CATEGORIES.map(c=>c[0]),intention:''},pkg.prefs||{});
  if(!ent.intentions)prefs.intention='';
  const savePrefs=()=>{pkg.prefs=prefs;if(opts.code&&!opts.preview)api.setPrefs(opts.code,prefs).catch(()=>{})};
  const visible=(pkg.influences||[]).filter(i=>{
    if(prefs.mode==='essential'&&!(i.significant||i.intensity>=4))return false;
    if(prefs.mode==='supportive'&&i.polarity!=='supportive')return false;
    if(prefs.mode==='caution'&&!(i.polarity==='caution'||i.polarity==='especially_sensitive'))return false;
    if(!prefs.cats.includes(i.category))return false;
    if(prefs.intention){const rel=INTENTIONS[prefs.intention]||[];if(!(i.significant||rel.includes(i.category)||(i.secondary_categories||[]).some(c=>rel.includes(c))))return false}
    return true});
  const y=calState.year,m=calState.month;const first=new Date(y,m,1);const startDow=first.getDay();const dim=new Date(y,m+1,0).getDate();
  const monthName=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow" aria-hidden="true">${d}</div>`).join('');
  let cells='';const total=Math.ceil((startDow+dim)/7)*7;
  for(let k=0;k<total;k++){
    const dnum=k-startDow+1;const dt=new Date(y,m,dnum);const ds=ymd(dt);const other=dnum<1||dnum>dim;
    const here=visible.filter(i=>i.start_date<=ds&&ds<=i.end_date);
    const longs=here.filter(i=>i.start_date!==i.end_date&&!i.parent_id).slice(0,2);
    const points=here.filter(i=>i.start_date===i.end_date||i.parent_id);
    const dominant=points[0];
    const marks=[...points.map(i=>icon(POLARITY[i.polarity].shape,POLARITY[i.polarity].color)),...(here.some(i=>i.significant)?[icon('star','var(--significant)')]:[])].slice(0,4).join('');
    const bands=longs.map((i,ix)=>`<span class="band ${ix?'b2':''}" style="background:${POLARITY[i.polarity].color};opacity:.5"></span>`).join('');
    const tint=dominant?` tint-${dominant.polarity}`:'';
    const label=`${fmtDate(ds)}${here.length?', '+here.map(i=>i.accessibility_label||`${POLARITY[i.polarity].label}: ${CAT[i.category]||i.category}`).join('; '):', no entries'}`;
    cells+=`<button type="button" class="day${other?' other':''}${ds===todayStr()?' today':''}${ds===calState.selected?' sel':''}${tint}" data-d="${ds}" aria-label="${esc(label)}" ${other?'tabindex="-1"':''}>${bands}<span class="num">${dt.getDate()}</span><span class="marks">${marks}</span></button>`;
  }
  const legend=Object.entries(POLARITY).map(([k,p])=>`<div>${icon(p.shape,p.color)}<span>${p.label}</span></div>`).join('')+`<div>${icon('star','var(--significant)')}<span>Especially significant</span></div><div><span class="mark" style="height:3px;background:var(--mixed);opacity:.6;border-radius:2px"></span><span>Longer period</span></div>`;
  const catChecks=CATEGORIES.filter(([k])=>ent.remedial||k!=='remedies').map(([k,l])=>`<label class="chk"><input type="checkbox" data-cat="${k}" ${prefs.cats.includes(k)?'checked':''}><span class="tag"><span class="dot" style="background:var(--cat-${k})"></span>${l}</span></label>`).join('');
  root.innerHTML=`<div class="layout">
   <section aria-label="Month calendar">
    <div class="card">
     <div class="cal-head"><button type="button" class="btn ghost small" data-nav="-1" aria-label="Previous month">&larr;</button><h2>${monthName}</h2><button type="button" class="btn ghost small" data-nav="1" aria-label="Next month">&rarr;</button></div>
     <div class="cal" role="grid">${dows}${cells}</div>
     <div class="legend" aria-label="Legend">${legend}</div>
    </div>
    <div class="card" style="margin-top:16px">
     <details><summary>Display options</summary>
      <label class="f"><span>Show</span></label>
      <div class="seg" role="group" aria-label="Display mode">${[['essential','Essential'],['supportive','Supportive'],['caution','Caution'],['everything','Everything']].map(([k,l])=>`<button type="button" data-mode="${k}" aria-pressed="${prefs.mode===k}">${l}</button>`).join('')}</div>
      <p class="small muted" style="margin-top:6px">Essential shows only especially significant or intensity 4–5 periods.</p>
      ${ent.intentions?`<label class="f" for="intent"><span>Current intention (optional)</span></label>
      <select id="intent"><option value="">— none —</option>${Object.keys(INTENTIONS).map(k=>`<option ${prefs.intention===k?'selected':''}>${k}</option>`).join('')}</select>
      <p class="small muted">Choosing an intention brings forward periods your astrologer has linked to related areas. It presents periods for review; it does not predict an outcome.</p>`:''}
      <label class="f"><span>Areas of life</span></label>${catChecks}
      <p class="small muted">Hiding an area changes what you see here only. Nothing is removed from your calendar.</p>
     </details>
    </div>
    ${ent.export?`<div class="card" style="margin-top:16px">
     <details><summary>Add to your own calendar app</summary>
      <p class="small muted">Download a calendar file (.ics) and import it into Apple Calendar, Google Calendar, or Outlook. Event titles are neutral; private notes are never included.</p>
      <div class="grid2">
       <div><label class="f"><span>Include</span></label>
        <label class="chk"><input type="checkbox" id="ics-sup" checked>Supportive periods</label>
        <label class="chk"><input type="checkbox" id="ics-cau" checked>Cautionary periods</label>
        <label class="chk"><input type="checkbox" id="ics-mix" checked>Mixed periods</label>
        <label class="chk"><input type="checkbox" id="ics-sig" checked>Especially significant periods</label></div>
       <div><label class="f"><span>Options</span></label>
        <label class="chk"><input type="checkbox" id="ics-cats" checked>Only the areas selected above</label>
        <label class="chk"><input type="checkbox" id="ics-time">Use exact times where provided</label>
        <label class="chk"><input type="checkbox" id="ics-rem" checked>Include preparation prompts</label></div>
      </div>
      <p><button type="button" class="btn ghost" id="ics">Download calendar file</button></p>
     </details>
    </div>`:''}
   </section>
   <aside id="daypanel" aria-label="Day detail"></aside>
  </div>`;
  const redraw=()=>drawCalendar(pkg,root,opts);
  root.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{calState.month+=Number(b.dataset.nav);if(calState.month<0){calState.month=11;calState.year--}if(calState.month>11){calState.month=0;calState.year++}redraw()});
  root.querySelectorAll('.day').forEach(b=>b.onclick=()=>{calState.selected=b.dataset.d;root.querySelectorAll('.day').forEach(x=>x.classList.toggle('sel',x.dataset.d===calState.selected));drawDay(pkg,visible,calState.selected,root);if(window.innerWidth<880)$('#daypanel',root).scrollIntoView({behavior:'smooth',block:'start'})});
  root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{prefs.mode=b.dataset.mode;savePrefs();redraw()});
  const intent=$('#intent',root);if(intent)intent.onchange=e=>{prefs.intention=e.target.value;savePrefs();redraw()};
  root.querySelectorAll('[data-cat]').forEach(c=>c.onchange=()=>{prefs.cats=[...root.querySelectorAll('[data-cat]:checked')].map(x=>x.dataset.cat);savePrefs();redraw()});
  const ics=$('#ics',root);if(ics)ics.onclick=()=>{const pol=[];if($('#ics-sup',root).checked)pol.push('supportive');if($('#ics-cau',root).checked)pol.push('caution','especially_sensitive');if($('#ics-mix',root).checked)pol.push('mixed');
    download(`sonnentau-${String(pkg.name).toLowerCase().replace(/\W+/g,'-')}.ics`,buildICS(pkg,{polarities:pol,significant:$('#ics-sig',root).checked,categories:$('#ics-cats',root).checked?prefs.cats:[],exactTimes:$('#ics-time',root).checked,reminders:$('#ics-rem',root).checked}),'text/calendar');toast('Calendar file downloaded')};
  drawDay(pkg,visible,calState.selected,root);
}
function drawDay(pkg,visible,ds,root){
  const here=visible.filter(i=>i.start_date<=ds&&ds<=i.end_date).sort((a,b)=>(b.significant-a.significant)||(b.intensity-a.intensity));
  const longs=here.filter(i=>i.start_date!==i.end_date&&!i.parent_id), windows=here.filter(i=>!longs.includes(i));
  const climate=here.length?(()=>{const s=new Set(here.map(i=>i.polarity));if(s.size===1)return POLARITY[[...s][0]].alt;return 'Variable conditions — more than one influence is active'})():'A quiet day in your calendar';
  const block=i=>{const p=POLARITY[i.polarity];const dur=i.start_date===i.end_date?fmtShort(i.start_date):`${fmtShort(i.start_date)} – ${fmtShort(i.end_date)}`;const parent=i.parent_id&&(pkg.influences||[]).find(x=>x.id===i.parent_id);
   const disc=i.disclaimer==='custom'?i.custom_disclaimer:(DISCLAIMERS[i.disclaimer]||'');
   const sec=(t,b,list)=>b?`<div class="sec"><h5>${t}</h5>${list?`<ul>${lines(b).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p>${esc(b)}</p>`}</div>`:'';
   return `<article class="inf ${i.polarity}" aria-label="${esc(i.accessibility_label||`${p.label}: ${CAT[i.category]||i.category}`)}">
    <div class="meta"><span class="pill ${i.polarity}">${icon(p.shape,p.color,12)} ${p.label}</span>${i.significant?`<span class="pill significant">${icon('star','var(--significant)',12)} Especially significant</span>`:''}<span class="tag"><span class="dot" style="background:var(--cat-${i.category})"></span>${esc(CAT[i.category]||'General')}</span>${(i.secondary_categories||[]).map(c=>`<span class="tag">${esc(CAT[c]||c)}</span>`).join('')}</div>
    <h4>${esc(i.title)}</h4>
    <div class="meta">${dur}${i.start_time?` · ${t5(i.start_time)}${i.end_time?'–'+t5(i.end_time):''}`:''} · Intensity ${i.intensity} of 5${parent?` · within “${esc(parent.title)}”`:''}</div>
    ${sec('Interpretation',i.client_interpretation)}
    ${sec('What you may notice',i.observation_prompt)}
    ${sec('Consider',i.reflection_prompt)}
    ${sec('Things you might do',i.recommended_actions,true)}
    ${sec('Consider postponing',i.avoidances,true)}
    ${sec('A possibility to observe',i.prediction)}
    ${sec('Optional practice',i.remedial_note)}
    ${sec('Astrological basis',i.technical_basis)}
    ${disc?`<div class="disc">${esc(disc)}</div>`:''}

   ${!here.length?'<p class="muted small">No published guidance for this date with your current display options.</p>':''}

/* ICS */
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m)}
function icsTitle(i){const cat=CAT[i.category]||'General';const p={supportive:'Supportive window',caution:'Allow extra care',mixed:'Variable conditions',especially_sensitive:'Important to review'}[i.polarity];return i.category==='rest'?'Rest and restoration period':`${p}: ${cat}`}
function buildICS(pkg,opts){
  const dt=s=>s.replace(/-/g,'');
  const addDay=s=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+1)).replace(/-/g,'')};
  const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Atelier Sonnentau//Calendar//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Atelier Sonnentau — '+icsEscape(pkg.name)];
  const list=(pkg.influences||[]).filter(i=>i.calendar_sync_enabled!==false).filter(i=>{
    if(opts.polarities.length&&!opts.polarities.includes(i.polarity)&&!(opts.significant&&i.significant))return false;
    if(opts.categories.length&&!opts.categories.includes(i.category))return false;return true});
  for(const i of list){
    out.push('BEGIN:VEVENT',`UID:${i.id}@sonnentau`,`DTSTAMP:${dt(todayStr())}T000000Z`);
    if(opts.exactTimes&&i.start_time){const tz=i.timezone||'UTC';out.push(`DTSTART;TZID=${tz}:${dt(i.start_date)}T${t5(i.start_time).replace(':','')}00`,`DTEND;TZID=${tz}:${dt(i.end_date)}T${t5(i.end_time||i.start_time).replace(':','')}00`)}
    else out.push(`DTSTART;VALUE=DATE:${dt(i.start_date)}`,`DTEND;VALUE=DATE:${addDay(i.end_date)}`);
    out.push(`SUMMARY:${icsEscape(icsTitle(i))}`);
    let desc=i.client_interpretation||'';if(opts.reminders&&i.recommended_actions)desc+='\n\nConsider: '+lines(i.recommended_actions).join('; ');
    out.push(`DESCRIPTION:${icsEscape(desc)}`,`CATEGORIES:${icsEscape(CAT[i.category]||'General')}`,'END:VEVENT');
  }
  out.push('END:VCALENDAR');return out.join('\r\n');
}

  document.body.appendChild(dlg);dlg.showModal();
  const form=$('#ef',dlg);
  const collect=()=>{const f=new FormData(form);const o={};const j={},s={};const secs=[];
    for(const [k,v] of f){if(k==='sec')secs.push(v);else if(k.startsWith('j:'))j[k.slice(2)]=v;else if(k.startsWith('s:'))s[k.slice(2)]=v;else o[k]=v}
    for(const cb of ['significant','show_prediction','show_exact_time','show_technical_basis','calendar_sync_enabled'])o[cb]=form.elements[cb].checked;
    o.intensity=Math.min(5,Math.max(1,Number(o.intensity)||3));o.secondary_categories=secs.filter(x=>x!==o.category);o.jyotish=j;o.source_reference=s;o.parent_id=o.parent_id||null;
    if(o.end_date<o.start_date)o.end_date=o.start_date;return o};
  const updateSig=()=>{const o=collect();const p=POLARITY[o.polarity];$('#sigpreview',dlg).innerHTML=`Marker: ${icon(p.shape,p.color)} <strong>${p.label}</strong> · ${p.hint} · Category accent <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cat-${o.category})"></span> ${esc(CAT[o.category])}${o.significant?' · '+icon('star','var(--significant)')+' significant':''}${o.category==='remedies'?' · <em>visible only to clients with the remedial add-on</em>':''}`};
  form.addEventListener('input',updateSig);updateSig();
  const review=()=>{const o=collect();const fields={Title:o.title,Interpretation:o.client_interpretation,Notice:o.observation_prompt,Consider:o.reflection_prompt,Act:o.recommended_actions,Postpone:o.avoidances,Prediction:o.prediction,Remedial:o.remedial_note};
    const hits=Object.entries(fields).map(([k,v])=>[k,langCheck(v)]).filter(([,h])=>h.length);
    const missing=[];if(!o.client_interpretation)missing.push('an interpretation');if(o.category==='health'&&!['health','custom'].includes(o.disclaimer))missing.push('a health boundary disclaimer');if(o.category==='legal'&&!['legal','custom'].includes(o.disclaimer))missing.push('a legal disclaimer');if(o.category==='money'&&!['financial','custom'].includes(o.disclaimer))missing.push('a financial disclaimer');if((o.category==='remedies'||o.remedial_note)&&!['remedy','custom'].includes(o.disclaimer))missing.push('the remedy disclaimer');
    if(o.polarity==='especially_sensitive'&&!o.reflection_prompt)missing.push('a reflection prompt (recommended for especially sensitive periods)');
    const p=POLARITY[o.polarity];
    $('#review',dlg).innerHTML=`<div class="card" style="background:var(--surface-2);box-shadow:none"><h3>Pre-publication review</h3>
     <div class="row"><span class="pill ${o.polarity}">${icon(p.shape,p.color,12)} ${p.label}</span>${o.significant?`<span class="pill significant">Especially significant</span>`:''}<span class="tag">${esc(CAT[o.category])}</span><span class="tag">Intensity ${o.intensity}</span><span class="tag">token: ${o.polarity} / ${p.shape}</span><span class="tag">aria: ${esc(o.accessibility_label||`${p.label}: ${CAT[o.category]}`)}</span></div>
     ${hits.length?`<div class="warn" style="margin-top:8px"><strong>Language check:</strong> possibly deterministic or alarmist wording — ${hits.map(([k,h])=>`${k}: “${h.map(esc).join('”, “')}”`).join('; ')}. Consider softening (“may”, “consider”, “allow extra care”).</div>`:`<div class="ok" style="margin-top:8px">Language check: no deterministic or alarmist phrases detected.</div>`}
     ${missing.length?`<div class="warn" style="margin-top:8px">Consider adding ${missing.join(', ')}.</div>`:''}
     <h4 style="margin-top:12px">Client will see</h4><div id="pvblock"></div>
     <p class="row"><button class="btn" type="button" id="confirmpub">Publish now</button><button class="btn ghost" type="button" id="backedit">Keep editing</button></p></div>`;
    const proj={...o,id:inf.id,start_time:o.show_exact_time?o.start_time:'',end_time:o.show_exact_time?o.end_time:'',prediction:o.show_prediction?o.prediction:'',technical_basis:o.show_technical_basis?o.technical_basis:'',custom_disclaimer:o.disclaimer==='custom'?o.custom_disclaimer:''};
    const stub=document.createElement('div');stub.innerHTML='<div id="daypanel"></div>';drawDay({influences:[proj],default_disclaimer:'none'},[proj],o.start_date,stub);$('#pvblock',dlg).innerHTML=stub.querySelector('.inf')?.outerHTML||'';
    $('#review',dlg).scrollIntoView({behavior:'smooth'});
    $('#confirmpub',dlg).onclick=()=>persist(true,'Published');$('#backedit',dlg).onclick=()=>{$('#review',dlg).innerHTML=''}};
  const busy=on=>dlg.querySelectorAll('button').forEach(b=>b.disabled=on);
  const persist=async(pub,msg)=>{busy(true);try{const o={...inf,...collect(),published:pub};await api.saveInfluence(o);dlg.close();dlg.remove();toast(msg);ctx.reload()}catch(e){busy(false);alert('Could not save: '+e.message)}};
  $('#savedraft',dlg).onclick=()=>{if(!form.reportValidity())return;persist(false,'Draft saved')};
  $('#publish',dlg).onclick=()=>{if(!form.reportValidity())return;review()};
  const un=$('#unpub',dlg);if(un)un.onclick=()=>persist(false,'Unpublished');
  $('#astemplate',dlg).onclick=async()=>{const o=collect();const name=prompt('Template name:',o.title);if(!name)return;const data={};for(const k of ['category','polarity','intensity','client_interpretation','observation_prompt','reflection_prompt','recommended_actions','avoidances','disclaimer','remedial_note','private_notes'])data[k]=o[k];await api.saveTemplate({id:uuid(),name,data});toast('Template saved');ctx.templates=await api.listTemplates()};
  const del=$('#del',dlg);if(del)del.onclick=async()=>{if(confirm('Delete this influence? Windows within it will be kept but unlinked.')){busy(true);await api.deleteInfluence(inf.id);dlg.close();dlg.remove();ctx.reload()}};
  $('#close',dlg).onclick=()=>{dlg.close();dlg.remove()};
  dlg.addEventListener('cancel',()=>dlg.remove());
}

/* ---------------- Templates ---------------- */
async function renderTemplates(){
  const templates=await api.listTemplates();
  app.innerHTML=`<p class="crumbs"><a href="#/admin">Clients</a> › Templates</p><div class="row between" style="margin-bottom:14px"><h1 style="margin:0">Templates</h1><div class="row">${templates.length?'':'<button type="button" class="btn ghost" id="starter">Add starter templates</button>'}<button type="button" class="btn" id="newt">New template</button></div></div>
   <div class="card"><p class="small muted">Private, reusable structures. Insert one into a client’s calendar from their Influences tab, then edit before publishing.</p>
   <ul class="list">${templates.map(t=>{const d=t.data||{};const p=POLARITY[d.polarity]||POLARITY.supportive;return `<li><div><a href="#/admin/templates" data-e="${t.id}">${esc(t.name)}</a><div class="small muted">${icon(p.shape,p.color)} ${p.label} · ${esc(CAT[d.category]||d.category||'General')} · intensity ${d.intensity||3}</div></div><div class="row"><button type="button" class="btn ghost small" data-e="${t.id}">Edit</button><button type="button" class="btn quiet small" data-d="${t.id}">Delete</button></div></li>`}).join('')||'<li class="muted">No templates yet.</li>'}</ul></div>`;
  const edit=t=>{const d=t.data||{};const dlg=document.createElement('dialog');
    dlg.innerHTML=`<div class="dh"><h2 style="margin:0">Template</h2><button type="button" class="btn quiet small" id="x" aria-label="Close">✕</button></div><div class="db"><form id="tf">${fld('Name','name',t.name,'text','required')}
     <div class="grid3"><label class="f"><span>Default polarity</span>${sel('polarity',Object.entries(POLARITY).map(([k,p])=>[k,p.label]),d.polarity||'supportive')}</label><label class="f"><span>Default category</span>${sel('category',CATEGORIES,d.category||'general')}</label><label class="f"><span>Default intensity</span><input type="number" name="intensity" min="1" max="5" value="${d.intensity||3}"></label></div>
     ${txt('Interpretation','client_interpretation',d.client_interpretation)}${txt('Notice prompt','observation_prompt',d.observation_prompt)}${txt('Consider prompt','reflection_prompt',d.reflection_prompt)}${txt('Act prompt','recommended_actions',d.recommended_actions)}${txt('Caution / postpone language','avoidances',d.avoidances)}${txt('Remedial note','remedial_note',d.remedial_note)}
     <label class="f"><span>Default disclaimer</span>${sel('disclaimer',Object.keys(DISCLAIMERS).map(k=>[k,k]),d.disclaimer||'none')}</label>${txt('Private Jyotish rationale','private_notes',d.private_notes)}
     <p><button class="btn" type="submit">Save template</button></p></form></div>`;
    document.body.appendChild(dlg);dlg.showModal();$('#x',dlg).onclick=()=>{dlg.close();dlg.remove()};dlg.addEventListener('cancel',()=>dlg.remove());
    $('#tf',dlg).onsubmit=async e=>{e.preventDefault();const data={};let name='';for(const [k,v] of new FormData(e.target)){if(k==='name')name=v;else data[k]=k==='intensity'?Number(v):v}await api.saveTemplate({id:t.id||uuid(),name,data});dlg.close();dlg.remove();toast('Template saved');renderTemplates()}};
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=e=>{e.preventDefault();edit(templates.find(t=>t.id===b.dataset.e))});
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this template?')){await api.deleteTemplate(b.dataset.d);renderTemplates()}});
  $('#newt').onclick=()=>edit({name:'',data:{}});
  const st=$('#starter');if(st)st.onclick=async()=>{st.disabled=true;for(const t of STARTER_TEMPLATES)await api.saveTemplate({id:uuid(),name:t.name,data:t.data});toast('Starter templates added');renderTemplates()};
}

/* ---------------- Boot ---------------- */
route();
</script>
</body>
</html>
