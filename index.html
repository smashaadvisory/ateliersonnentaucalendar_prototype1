<style>
:root{
  --bg:#F5EFDF; --surface:#FCF8EC; --surface-2:#F7F1E0; --text:#2B2926; --muted:#6E685E;
  --line:rgba(70,58,35,.13); --line-strong:rgba(70,58,35,.3);
  --primary:#3F466B; --primary-hover:#2F3554; --focus:#7A6AA8; --gold:#B58A4A;
  --supportive:#6F9B82; --supportive-soft:#E5F0E8;
  --caution:#B58A4A; --caution-soft:#F5EBD7;
  --mixed:#817A9A; --mixed-soft:#ECEAF3;
  --sensitive:#8B4F4F; --sensitive-soft:#F3E2E0;
  --significant:#4F5D86; --significant-soft:#E5EAF5;
  --cat-work:#4F5D86; --cat-money:#7D8A5E; --cat-relationships:#9C6B7C; --cat-communication:#6F7F91;
  --cat-home:#B07E5E; --cat-health:#5F8F89; --cat-travel:#6C8FA8; --cat-learning:#5E6595;
  --cat-creativity:#C08A5A; --cat-spiritual:#6E5E8E; --cat-legal:#5F6672; --cat-community:#5E8F8A;
  --cat-rest:#8A93A8; --cat-decisions:#4F5D86; --cat-endings:#7A6A82; --cat-remedies:#B39358; --cat-general:#7A7772;
  --serif:"Cormorant Garamond",Georgia,"Iowan Old Style",serif;
  --brand:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --sans:"EB Garamond","Cormorant Garamond",Garamond,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --shadow:0 1px 2px rgba(60,50,30,.05),0 14px 34px -18px rgba(60,50,30,.28);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.2;margin:0 0 .4em;letter-spacing:.005em}
h1{font-size:2.2rem} h2{font-size:1.6rem} h3{font-size:1.3rem} h4{font-size:1.2rem}
p{margin:.3em 0 .9em}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 60px}
.wrap:has(> .home){padding-top:0;padding-bottom:16px}
/* header */
.site-header{position:sticky;top:0;z-index:5;background:rgba(245,239,223,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.site-header .in{max-width:1120px;margin:0 auto;padding:10px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.hl{display:flex;gap:6px;flex-wrap:wrap;justify-self:start}
.hr{display:flex;gap:6px;flex-wrap:wrap;justify-self:end}
.hb{font-family:var(--brand);font-style:italic;font-size:1.45rem;color:var(--primary);text-decoration:none;text-align:center;line-height:1.05;font-weight:500}
.hb small{display:block;font-family:var(--sans);font-style:normal;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:500}
@media(max-width:620px){.site-header .in{grid-template-columns:1fr auto}.hb{display:none}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--primary);color:#fff;border:1px solid var(--primary);padding:8px 20px;border-radius:999px;font-size:1rem;font-weight:500;text-decoration:none;letter-spacing:.01em;transition:background .15s,box-shadow .15s,transform .05s;box-shadow:0 6px 16px -10px rgba(63,70,107,.7)}
.btn:hover{background:var(--primary-hover)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--primary);border-color:var(--line-strong);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
.btn.quiet:hover{background:var(--surface-2);color:var(--text)}
.btn.small{padding:5px 14px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:default}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
@media(max-width:560px){.card{padding:16px}}
.note{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:.9rem;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:block;font-size:.95rem;color:var(--muted);margin:12px 0 4px}
label.f span{display:block;margin-bottom:4px}
label.f em{font-style:italic;opacity:.85}
input[type=text],input[type=date],input[type=time],input[type=password],input[type=number],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px;color:var(--text);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(122,106,168,.18);outline:none}
textarea{min-height:78px;resize:vertical}
.chk{display:flex;align-items:center;gap:9px;font-size:.93rem;margin:7px 0}
.chk input{width:18px;height:18px;accent-color:var(--primary);flex:none}
.chips{gap:6px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;border:1px solid var(--line-strong);border-radius:999px;padding:2px 11px;font-size:.88rem;background:var(--surface);transition:background .12s,color .12s}
.chip input:checked+span{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.92rem}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.84rem;background:var(--surface)}
.tag .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 11px;font-size:.86rem;font-weight:500}
.pill.supportive{background:var(--supportive-soft);color:#3f6a51}
.pill.caution{background:var(--caution-soft);color:#7a5a27}
.pill.mixed{background:var(--mixed-soft);color:#554d72}
.pill.especially_sensitive{background:var(--sensitive-soft);color:#6e3b3b}
.pill.significant{background:var(--significant-soft);color:#3a466a}
.pill.draft{background:var(--surface-2);color:var(--muted)}
.mark{display:inline-block;width:14px;height:14px;vertical-align:-2px;flex:none}
.warn{background:var(--caution-soft);border-radius:10px;padding:9px 13px;font-size:.88rem;color:#6d4f22}
.ok{background:var(--supportive-soft);border-radius:10px;padding:9px 13px;font-size:.88rem;color:#3f6a51}
.err{color:var(--sensitive);font-size:.9rem;margin-top:8px;min-height:1.2em}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;background:var(--surface-2);padding:5px 10px;border-radius:8px;font-size:.95rem}
.loading{color:var(--muted);text-align:center;padding:40px;font-style:italic;font-family:var(--serif);font-size:1.15rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
/* welcome */
.welcome{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;animation:wfade 2.6s ease forwards;pointer-events:none}
.welcome .wk{font-family:var(--sans);font-size:.85rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;padding-left:.32em}
.welcome h1{font-family:var(--brand);font-style:italic;font-size:clamp(2.8rem,7vw,4.2rem);color:var(--primary);margin:0;font-weight:500;line-height:1.05}
.welcome .orn{margin:22px auto 0}
@keyframes wfade{0%{opacity:0}18%{opacity:1}78%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.welcome{animation:wfadeflat 1.6s linear forwards}@keyframes wfadeflat{0%,90%{opacity:1}100%{opacity:0}}}
/* home */
.home{display:flex;flex-direction:column;min-height:calc(100vh - 78px);min-height:calc(100dvh - 78px)}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 16px 48px}
.hero h1{font-family:var(--brand);font-style:italic;font-size:clamp(2.8rem,7vw,4.2rem);margin:0;color:var(--primary);font-weight:500;letter-spacing:.005em;line-height:1.05}
.hero .sub{font-family:var(--sans);font-weight:500;font-size:clamp(.9rem,2vw,1.15rem);letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:16px 0 0;padding-left:.32em}
.home .foot{text-align:center;max-width:520px;margin:0 auto;padding:0 8px 8px;font-size:.72rem;line-height:1.5;color:var(--muted);opacity:.55}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:30px auto 30px;color:var(--gold)}
.orn::before,.orn::after{content:"";height:1px;width:min(90px,22vw);background:linear-gradient(to right,transparent,var(--line-strong))}
.orn::after{background:linear-gradient(to left,transparent,var(--line-strong))}
.hero .lead{max-width:520px;margin:0 auto 26px;color:var(--muted)}
.hero .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.entry{max-width:460px;margin:6vh auto;text-align:center}
.entry h1{font-size:2rem}
.entry input{text-align:center;letter-spacing:.14em;font-size:1.15rem;text-transform:uppercase;font-family:var(--sans)}
.entry input[type=password]{letter-spacing:.3em;text-transform:none}
.entry .consent{font-size:.62rem;line-height:1.4;color:var(--muted);opacity:.38;margin:-4px 0 0;font-style:italic}
/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.cal-head h2{margin:0;font-size:1.65rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);text-align:center;padding:6px 0 8px}
.day{position:relative;min-height:66px;border:0;border-radius:12px;background:transparent;padding:12px 7px 6px;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%;transition:background .15s}
.day:hover{background:var(--surface-2)}
.day.other{opacity:.35}
.day.sel{box-shadow:inset 0 0 0 1.5px var(--primary);background:var(--surface-2)}
.day .num{font-size:.86rem;color:var(--muted);font-weight:500;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px}
.day.today .num{background:var(--primary);color:#fff}
.day .marks{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto;min-height:14px;align-items:center}
.day .more{font-size:.68rem;line-height:1;color:var(--muted);letter-spacing:.02em}
.day .band{position:absolute;left:5px;right:5px;top:4px;height:4px;border-radius:3px}
.day .band.b2{top:10px}
.day .band.notch{height:6px;top:3px}
.day .marks .win{display:inline-flex;border:1.5px solid;border-radius:50%;padding:1px;line-height:0}
.day.tint-supportive{background:linear-gradient(var(--supportive-soft),transparent 80%)}
.day.tint-caution{background:linear-gradient(var(--caution-soft),transparent 80%)}
.day.tint-mixed{background:linear-gradient(var(--mixed-soft),transparent 80%)}
.day.tint-especially_sensitive{background:linear-gradient(var(--sensitive-soft),transparent 80%)}
@media(max-width:560px){.day{min-height:54px;padding:10px 4px 4px}.day .num{font-size:.76rem;width:20px;height:20px}.mark{width:11px;height:11px}.cal{gap:3px}}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.82rem;color:var(--muted);margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.legend div{display:flex;align-items:center;gap:6px}
.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start}
@media(max-width:880px){.layout{grid-template-columns:1fr}}
.inf{border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:12px;padding:14px 16px;background:var(--surface);margin-bottom:12px}
.inf.supportive{border-left-color:var(--supportive)}
.inf.caution{border-left-color:var(--caution)}
.inf.mixed{border-left-color:var(--mixed)}
.inf.especially_sensitive{border-left-color:var(--sensitive)}
.inf h4{margin:6px 0 2px}
.inf .meta{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.inf .sec{margin-top:10px}
.inf .sec h5{margin:0 0 2px;font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.inf .sec p,.inf .sec ul{margin:0;font-size:.95rem}
.inf .sec ul{padding-left:18px}
.inf .pred{font-style:italic;margin-top:4px!important}
.inf .areas{display:flex;flex-wrap:wrap;gap:10px 22px}
.tag.sup{background:var(--supportive-soft);border-color:transparent}
.tag.dif{background:var(--caution-soft);border-color:transparent}
.winlink{cursor:pointer;font:inherit;font-size:.84rem}
.winlink:hover{background:var(--surface-2)}
.inf .disc{font-size:.8rem;line-height:1.45;color:var(--muted);opacity:.85;border-top:1px dashed var(--line-strong);padding-top:7px;margin-top:10px}
.daydisc{font-size:.8rem;line-height:1.45;color:var(--muted);opacity:.8;margin-top:14px}
details summary{cursor:pointer;font-weight:600;font-size:.93rem;list-style:none;display:flex;align-items:center;gap:8px}
details summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-left:2px}
details[open] summary::before{transform:rotate(45deg)}
details summary::-webkit-details-marker{display:none}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;flex-wrap:wrap;background:var(--surface)}
.seg button{background:transparent;border:0;padding:6px 14px;font-size:.87rem}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff}
/* admin */
.crumbs{font-size:.86rem;color:var(--muted);margin:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 18px;flex-wrap:wrap}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--muted);font-size:.93rem;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;transition:background .15s}
.list li:hover{background:var(--surface-2)}
.list li a{font-family:var(--serif);font-size:1.2rem;text-decoration:none}
.list li a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);padding:0;width:min(940px,96vw);max-height:92vh;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(43,41,38,.4);backdrop-filter:blur(2px)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1;border-radius:18px 18px 0 0}
dialog .db{padding:14px 20px 22px;overflow:auto;max-height:calc(92vh - 62px)}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 16px 16px;margin:16px 0}
legend{font-family:var(--serif);font-size:1.15rem;padding:0 8px;color:var(--primary)}
.setup ol{padding-left:20px}
.setup li{margin-bottom:8px}
.setup code{background:var(--surface-2);padding:2px 6px;border-radius:6px;font-size:.9em}
/* gochara */
.kundli{width:100%;max-width:440px;height:auto;display:block;margin:0 auto;shape-rendering:geometricPrecision}
.kundli .house{fill:#FDFAF1;stroke:none;cursor:pointer;transition:fill .12s}
.kundli .house:hover{fill:var(--surface-2)}
.kundli .house.h-sel{fill:#E9E4F3}
.kundli .house.h-occ{fill:var(--significant-soft)}
.kundli .house.h-dr{fill:var(--caution-soft)}
.kundli .house.h-tg{fill:var(--supportive-soft)}
.kundli .frame{fill:none;stroke:#8d8272;stroke-width:.55;pointer-events:none;vector-effect:non-scaling-stroke;stroke-width:1.4px}
.kundli .lagna{stroke:var(--primary);stroke-width:1.1;pointer-events:none}
.kundli .centre{font-size:3.4px;fill:var(--muted);font-style:italic;pointer-events:none}
.kundli .badge circle{fill:var(--surface);stroke:#b9ad98;stroke-width:.35;pointer-events:none}
.kundli .badge text{font-size:2.6px;fill:var(--muted);pointer-events:none}
.kundli .sign{font-size:2.9px;fill:var(--muted);pointer-events:none;font-weight:600;letter-spacing:.05em}
.kundli .hnum{font-size:2.5px;fill:var(--muted);opacity:.75;pointer-events:none}
.kundli .pl{fill:var(--text);cursor:pointer;font-weight:500;paint-order:stroke;stroke:var(--surface);stroke-width:.9;stroke-linejoin:round}
.kundli .pl:hover{fill:var(--primary)}
.kundli .p-sel{fill:var(--primary);font-weight:700}
.kundli .p-mark{fill:var(--significant);font-weight:600;text-decoration:underline}
.kundli .p-contact{fill:var(--sensitive);font-weight:700;text-decoration:underline double}
.kundli .drishti path{fill:none;stroke:var(--caution);stroke-width:.7;stroke-dasharray:2 1.2;opacity:.9;pointer-events:none;stroke-linecap:round}
.kundli .drishti .dend{fill:var(--caution);pointer-events:none}
.kundli .drishti .dlab{fill:var(--surface);stroke:var(--caution);stroke-width:.5;pointer-events:none}
.kundli .drishti .dtxt{font-size:2.6px;fill:#7a5a27;font-weight:700;pointer-events:none}
.goch .g-time{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.goch .g-time input[type=date],.goch .g-time input[type=time]{width:auto;padding:5px 8px}
.goch .g-time input[type=range]{width:100%;margin:10px 0 4px;accent-color:var(--primary)}
.g-charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;position:relative}
.g-fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.g-fig figcaption{font-size:.9rem;margin-bottom:8px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.g-fig figcaption .seg button{padding:3px 10px;font-size:.82rem}
.g-legend{display:flex;flex-wrap:wrap;gap:6px 16px;grid-column:1/-1;padding:4px 2px}

<script>
/* ============================================================================
   Gochara engine — pure calculation layer (no DOM).
   Sidereal (Lahiri), geocentric, whole-sign bhava from natal Lagna or Chandra.
   Sources: Meeus, Astronomical Algorithms (Sun ch.25, Moon ch.47, sidereal time
   ch.12, nutation ch.22); JPL "Keplerian elements for approximate positions"
   (Standish, 1800–2050) for the planets; optional astronomy-engine (MIT) when
   present on window for higher planetary accuracy.
   ============================================================================ */
const GOCHARA=(()=>{
'use strict';
const D2R=Math.PI/180, R2D=180/Math.PI;
const norm=x=>((x%360)+360)%360;
const sin=x=>Math.sin(x*D2R), cos=x=>Math.cos(x*D2R);

/* ---------- time ---------- */
function jdFromDate(date){return date.getTime()/86400000+2440587.5}
function dateFromJd(jd){return new Date((jd-2440587.5)*86400000)}
function deltaT(jd){ // seconds, Espenak–Meeus polynomial (2005–2050 fit)
  const y=2000+(jd-2451545)/365.25; const t=y-2000;
  if(y<2005)return 63.86+0.3345*t-0.060374*t*t+0.0017275*t*t*t+0.000651814*t*t*t*t+0.00002373599*t*t*t*t*t;
  if(y<2050)return 62.92+0.32217*t+0.005589*t*t;
  return -20+32*((y-1820)/100)**2-0.5628*(2150-y);
}
const centuries=jdTT=>(jdTT-2451545)/36525;

/* ---------- ayanamsa (Lahiri / Chitrapaksha) ---------- */
// Official definition (Indian Calendar Reform Committee, as used by Swiss Ephemeris / AstroSage):
// 23°15′00.658″ on 21 March 1956 0h (JD 2435553.5), carried forward with general precession in longitude.
const AYAN_T0=(2435553.5-2451545)/36525, AYAN_A0=23.250182778;
const precessLon=T=>5028.796195*T+1.1054348*T*T; // arcseconds, cumulative from J2000
function ayanamsa(jdTT){const T=centuries(jdTT);return AYAN_A0+(precessLon(T)-precessLon(AYAN_T0))/3600}

/* ---------- nutation & obliquity ---------- */
function nutation(T){const om=norm(125.04452-1934.136261*T), Ls=norm(280.4665+36000.7698*T), Lm=norm(218.3165+481267.8813*T);
  const dpsi=(-17.20*sin(om)-1.32*sin(2*Ls)-0.23*sin(2*Lm)+0.21*sin(2*om))/3600;
  const deps=(9.20*cos(om)+0.57*cos(2*Ls)+0.10*cos(2*Lm)-0.09*cos(2*om))/3600;return {dpsi,deps}}
function meanObliquity(T){return 23.439291111-(46.8150*T+0.00059*T*T-0.001813*T*T*T)/3600}

/* ---------- Sun (Meeus ch.25) — apparent geocentric longitude of date ---------- */
function sunLongitude(T){const L0=norm(280.46646+36000.76983*T+0.0003032*T*T), M=norm(357.52911+35999.05029*T-0.0001537*T*T);
  const C=(1.914602-0.004817*T-0.000014*T*T)*sin(M)+(0.019993-0.000101*T)*sin(2*M)+0.000289*sin(3*M);
  const om=125.04-1934.136*T; return norm(L0+C-0.00569-0.00478*sin(om))}

/* ---------- Moon (Meeus ch.47, longitude terms) ---------- */
const MOON_L=[[0,0,1,0,6288774],[2,0,-1,0,1274027],[2,0,0,0,658314],[0,0,2,0,213618],[0,1,0,0,-185116],[0,0,0,2,-114332],[2,0,-2,0,58793],[2,-1,-1,0,57066],[2,0,1,0,53322],[2,-1,0,0,45758],[0,1,-1,0,-40923],[1,0,0,0,-34720],[0,1,1,0,-30383],[2,0,0,-2,15327],[0,0,1,2,-12528],[0,0,1,-2,10980],[4,0,-1,0,10675],[0,0,3,0,10034],[4,0,-2,0,8548],[2,1,-1,0,-7888],[2,1,0,0,-6766],[1,0,-1,0,-5163],[1,1,0,0,4987],[2,-1,1,0,4036],[2,0,2,0,3994],[4,0,0,0,3861],[2,0,-3,0,3665],[0,1,-2,0,-2689],[2,0,-1,2,-2602],[2,-1,-2,0,2390],[1,0,1,0,-2348],[2,-2,0,0,2236],[0,1,2,0,-2120],[0,2,0,0,-2069],[2,-2,-1,0,2048],[2,0,1,-2,-1773],[2,0,0,2,-1595],[4,-1,-1,0,1215],[0,0,2,2,-1110],[3,0,-1,0,-892],[2,1,1,0,-810],[4,-1,-2,0,759],[0,2,-1,0,-713],[2,2,-1,0,-700],[2,1,-2,0,691],[2,-1,0,-2,596],[4,0,1,0,549],[0,0,4,0,537],[4,-1,0,0,520],[1,0,-2,0,-487],[2,1,0,-2,-399],[0,0,2,-2,-381],[1,1,1,0,351],[3,0,-2,0,-340],[4,0,-3,0,330],[2,-1,2,0,327],[0,2,1,0,-323],[1,1,-1,0,299],[2,0,3,0,294]];
function moonArgs(T){return {
  Lp:norm(218.3164477+481267.88123421*T-0.0015786*T*T+T*T*T/538841-T*T*T*T/65194000),
  D:norm(297.8501921+445267.1114034*T-0.0018819*T*T+T*T*T/545868-T*T*T*T/113065000),
  M:norm(357.5291092+35999.0502909*T-0.0001536*T*T+T*T*T/24490000),
  Mp:norm(134.9633964+477198.8675055*T+0.0087414*T*T+T*T*T/69699-T*T*T*T/14712000),
  F:norm(93.2720950+483202.0175233*T-0.0036539*T*T-T*T*T/3526000+T*T*T*T/863310000),
  E:1-0.002516*T-0.0000074*T*T}}
function moonLongitude(T){const a=moonArgs(T);let s=0;
  for(const [d,m,mp,f,c] of MOON_L){let k=c;if(Math.abs(m)===1)k*=a.E;else if(Math.abs(m)===2)k*=a.E*a.E;s+=k*sin(d*a.D+m*a.M+mp*a.Mp+f*a.F)}
  const A1=119.75+131.849*T, A2=53.09+479264.290*T; s+=3958*sin(A1)+1962*sin(a.Lp-a.F)+318*sin(A2);
  return norm(a.Lp+s/1e6+nutation(T).dpsi)}
function meanNode(T){return norm(125.0445479-1934.1362891*T+0.0020754*T*T+T*T*T/467441-T*T*T*T/60616000)}
function trueNode(T){const a=moonArgs(T);return norm(meanNode(T)-1.4979*sin(2*(a.D-a.F))-0.1500*sin(a.M)-0.1226*sin(2*a.D)+0.1176*sin(2*a.F)-0.0801*sin(2*(a.Mp-a.F)))}

/* ---------- Planets: JPL Keplerian elements (Standish), 1800–2050 ---------- */
// a(AU), e, I(deg), L(deg), long.peri(deg), long.node(deg) and rates per century
const KEP={
  mercury:[[0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593],[0.00000037,0.00001906,-0.00594749,149472.67411175,0.16047689,-0.12534081]],
  venus:[[0.72333566,0.00677672,3.39467605,181.97909950,131.60246718,76.67984255],[0.00000390,-0.00004107,-0.00078890,58517.81538729,0.00268329,-0.27769418]],
  earth:[[1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0.0],[0.00000562,-0.00004392,-0.01294668,35999.37244981,0.32327364,0.0]],
  mars:[[1.52371034,0.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891],[0.00001847,0.00007882,-0.00813131,19140.30268499,0.44441088,-0.29257343]],
  jupiter:[[5.20288700,0.04838624,1.30439695,34.39644051,14.72847983,100.47390909],[-0.00011607,-0.00013253,-0.00183714,3034.74612775,0.21252668,0.20469106]],
  saturn:[[9.53667594,0.05386179,2.48599187,49.95424423,92.59887831,113.66242448],[-0.00125060,-0.00050991,0.00193609,1222.49362201,-0.41897216,-0.28867794]],
  uranus:[[19.18916464,0.04725744,0.77263783,313.23810451,170.95427630,74.01692503],[-0.00196176,-0.00004397,-0.00242939,428.48202785,0.40805281,0.04240589]],
  neptune:[[30.06992276,0.00859048,1.77004347,-55.12002969,44.96476227,131.78422574],[0.00026291,0.00005105,0.00035372,218.45945325,-0.32241464,-0.00508664]],
  pluto:[[39.48211675,0.24882730,17.14001206,238.92903833,224.06891629,110.30393684],[-0.00031596,0.00005170,0.00004818,145.20780515,-0.04062942,-0.01183482]]
};
function helio(body,T){const [e0,r]=KEP[body];const a=e0[0]+r[0]*T,e=e0[1]+r[1]*T,I=e0[2]+r[2]*T,L=e0[3]+r[3]*T,w=e0[4]+r[4]*T,O=e0[5]+r[5]*T;
  const om=w-O;let M=norm(L-w);if(M>180)M-=360;
  let E=M+e*R2D*sin(M);for(let k=0;k<12;k++){const dE=(M-(E-e*R2D*sin(E)))/(1-e*cos(E));E+=dE;if(Math.abs(dE)<1e-8)break}
  const xp=a*(cos(E)-e),yp=a*Math.sqrt(1-e*e)*sin(E);
  const cw=cos(om),sw=sin(om),cO=cos(O),sO=sin(O),cI=cos(I),sI=sin(I);
  return {x:(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp, y:(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp, z:(sw*sI)*xp+(cw*sI)*yp}}
function planetLongitude(body,T){ // apparent geocentric ecliptic longitude of date
  const e=helio('earth',T);let p=helio(body,T);
  let dx=p.x-e.x,dy=p.y-e.y,dz=p.z-e.z;const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
  const lt=dist*0.0057755183/36525; p=helio(body,T-lt);dx=p.x-e.x;dy=p.y-e.y;dz=p.z-e.z; // light-time
  let lon=norm(Math.atan2(dy,dx)*R2D);
  lon+= (5028.796195*T+1.1054348*T*T)/3600; // J2000 ecliptic → ecliptic of date
  lon+= nutation(T).dpsi;
  const sun=sunLongitude(T); lon-= (20.49552/3600)*cos(sun-lon); // annual aberration
  return norm(lon)}

/* ---------- optional high-accuracy library (astronomy-engine on window) ---------- */
function libAvailable(){const A=(typeof window!=='undefined')&&window.Astronomy;return !!(A&&A.GeoVector&&A.Ecliptic&&A.SunPosition&&A.Body)}
function libLongitudes(date){ // returns {sun,moon,mercury,...} tropical apparent of date, or null
  try{const A=window.Astronomy;const t=A.MakeTime(date);
    const sunA=A.SunPosition(t).elon; const sunB=A.Ecliptic(A.GeoVector(A.Body.Sun,t,true)).elon;
    let corr=sunA-sunB; if(corr>180)corr-=360;if(corr<-180)corr+=360; // 0 if Ecliptic() is of-date, ≈precession if J2000
    const out={sun:norm(sunA)};
    const names={mercury:'Mercury',venus:'Venus',mars:'Mars',jupiter:'Jupiter',saturn:'Saturn',uranus:'Uranus',neptune:'Neptune',pluto:'Pluto'};
    for(const k in names)out[k]=norm(A.Ecliptic(A.GeoVector(A.Body[names[k]],t,true)).elon+corr);
    out.moon=A.EclipticGeoMoon?norm(A.EclipticGeoMoon(t).lon):norm(A.Ecliptic(A.GeoMoon(t)).elon+corr);
    return out}catch(e){return null}}

/* ---------- master position function ---------- */
const GRAHA=[
  {key:'sun',name:'Surya',en:'Sun',ab:'Su'},{key:'moon',name:'Chandra',en:'Moon',ab:'Ch'},{key:'mars',name:'Mangala',en:'Mars',ab:'Ma'},
  {key:'mercury',name:'Budha',en:'Mercury',ab:'Bu'},{key:'jupiter',name:'Guru',en:'Jupiter',ab:'Gu'},{key:'venus',name:'Shukra',en:'Venus',ab:'Sk'},
  {key:'saturn',name:'Shani',en:'Saturn',ab:'Sa'},{key:'rahu',name:'Rahu',en:'Rahu',ab:'Ra'},{key:'ketu',name:'Ketu',en:'Ketu',ab:'Ke'},
  {key:'uranus',name:'Uranus',en:'Uranus',ab:'Ur',outer:true},{key:'neptune',name:'Neptune',en:'Neptune',ab:'Ne',outer:true},{key:'pluto',name:'Pluto',en:'Pluto',ab:'Pl',outer:true}];
function tropicalAll(date,opts){const jd=jdFromDate(date);const jdTT=jd+deltaT(jd)/86400;const T=centuries(jdTT);
  let src='built-in (Meeus / JPL Keplerian)';let lib=null;
  if(opts.useLibrary!==false&&libAvailable()){lib=libLongitudes(date);
    if(lib){const dm=Math.abs(norm(lib.moon-moonLongitude(T)+180)-180),ds=Math.abs(norm(lib.sun-sunLongitude(T)+180)-180);
      if(dm>0.5||ds>0.1)lib=null;else src='astronomy-engine (VSOP87/ELP-class) + built-in nodes'}}
  const out={};
  out.sun=lib?lib.sun:sunLongitude(T);
  out.moon=lib?lib.moon:moonLongitude(T);
  for(const b of ['mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto'])out[b]=lib?lib[b]:planetLongitude(b,T);
  out.rahu=opts.nodeMode==='mean'?meanNode(T):trueNode(T);out.ketu=norm(out.rahu+180);
  return {lons:out,jd,jdTT,T,ayan:ayanamsa(jdTT),source:src}}

/* ---------- Jyotisha derivations ---------- */
const RASHI=['Mesha','Vrishabha','Mithuna','Karka','Simha','Kanya','Tula','Vrishchika','Dhanu','Makara','Kumbha','Meena'];
const RASHI_EN=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
const RASHI_AB=['Ar','Ta','Ge','Cn','Le','Vi','Li','Sc','Sg','Cp','Aq','Pi'];
const SIGN_LORD=['mars','venus','mercury','moon','sun','mercury','venus','mars','jupiter','saturn','saturn','jupiter'];
const NAK=['Ashwini','Bharani','Krittika','Rohini','Mrigashira','Ardra','Punarvasu','Pushya','Ashlesha','Magha','Purva Phalguni','Uttara Phalguni','Hasta','Chitra','Swati','Vishakha','Anuradha','Jyeshtha','Mula','Purva Ashadha','Uttara Ashadha','Shravana','Dhanishta','Shatabhisha','Purva Bhadrapada','Uttara Bhadrapada','Revati'];
const DASHA_LORDS=['ketu','venus','sun','moon','mars','rahu','jupiter','saturn','mercury'];
const DASHA_YEARS={ketu:7,venus:20,sun:6,moon:10,mars:7,rahu:18,jupiter:16,saturn:19,mercury:17};
const EXALT={sun:[0,10],moon:[1,3],mars:[9,28],mercury:[5,15],jupiter:[3,5],venus:[11,27],saturn:[6,20]};
const OWN={sun:[4],moon:[3],mars:[0,7],mercury:[2,5],jupiter:[8,11],venus:[1,6],saturn:[9,10]};
const MOOLA={sun:[4,0,20],moon:[1,3,30],mars:[0,0,12],mercury:[5,15,20],jupiter:[8,0,10],venus:[6,0,15],saturn:[10,0,20]};
const COMBUST={moon:12,mars:17,mercury:14,jupiter:11,venus:10,saturn:15};const COMBUST_RETRO={mercury:12,venus:8};
const DRISHTI_RULES={default:[7],mars:[4,7,8],jupiter:[5,7,9],saturn:[3,7,10],rahu:[5,7,9],ketu:[],uranus:[],neptune:[],pluto:[]};
const dms=x=>{const d=Math.floor(x),m=Math.floor((x-d)*60),s=Math.round(((x-d)*60-m)*60);return {d,m:s===60?m+1:m,s:s===60?0:s}};
const fmtDeg=x=>{const o=dms(x);return `${o.d}°${String(o.m).padStart(2,'0')}′${String(o.s).padStart(2,'0')}″`};
function describe(lon){const sign=Math.floor(lon/30),deg=lon-sign*30;const nakIdx=Math.floor(lon/(360/27));const inNak=lon-nakIdx*(360/27);const pada=Math.floor(inNak/(360/108))+1;
  const navamsa=(sign*9+Math.floor(deg/(10/3)))%12;
  return {lon,sign,deg,nak:nakIdx,nakName:NAK[nakIdx],pada,nakFrac:inNak/(360/27),navamsa,vargottama:navamsa===sign}}
function dignity(key,sign,deg){if(!EXALT[key])return '';
  if(EXALT[key][0]===sign)return 'exalted';if((EXALT[key][0]+6)%12===sign)return 'debilitated';
  const mt=MOOLA[key];if(mt&&mt[0]===sign&&deg>=mt[1]&&deg<mt[2])return 'moolatrikona';
  if(OWN[key].includes(sign))return 'own sign';return ''}
const houseFrom=(sign,refSign)=>((sign-refSign+12)%12)+1;
function drishtiTargets(key,house){const r=DRISHTI_RULES[key]||DRISHTI_RULES.default;return r.map(n=>({n,house:((house-1+n-1)%12)+1}))}

/* ---------- full chart at an instant ---------- */
function chart(date,opts={}){const base=tropicalAll(date,opts);const ayan=base.ayan;const planets=[];
  const step=0.25;const p2=tropicalAll(new Date(date.getTime()+step*86400000),{...opts,useLibrary:opts.useLibrary});
  const sunSid=norm(base.lons.sun-ayan);
  for(const g of GRAHA){if(g.outer&&!opts.outer)continue;const lon=norm(base.lons[g.key]-ayan);const d=describe(lon);
    let speed=norm(p2.lons[g.key]-base.lons[g.key]+180)-180;speed=speed/step; // deg/day
    const retro=(g.key==='rahu'||g.key==='ketu')?true:speed<0;
    const dist=Math.abs(norm(lon-sunSid+180)-180);
    const orb=retro&&COMBUST_RETRO[g.key]?COMBUST_RETRO[g.key]:COMBUST[g.key];
    planets.push({...g,...d,tropical:base.lons[g.key],speed,retro,dignity:dignity(g.key,d.sign,d.deg),combust:orb?dist<orb:false,signLord:SIGN_LORD[d.sign]})}
  const moon=planets.find(p=>p.key==='moon');
  return {date,jd:base.jd,jdTT:base.jdTT,ayan,source:base.source,planets,moonSign:moon.sign,tropicalSun:base.lons.sun}}

/* ---------- single body + next ingress ---------- */
function bodySidereal(key,date,opts={}){const jd=jdFromDate(date);const jdTT=jd+deltaT(jd)/86400;const T=centuries(jdTT);let lon;

    if(yg&&(yg.yogas.length||yg.doshas.length))L.push(`\nNOTABLE YOGAS: ${yg.yogas.map(y=>y.name+(y.grade!=='present'?' ('+y.grade+')':'')).join('; ')||'none from the standard list'}.\nDOSHAS: ${yg.doshas.map(y=>y.name+(y.grade!=='present'?' ('+y.grade+')':'')).join('; ')||'none from the standard list'}.`);
    L.push(`\nTRANSITS on ${z.date} ${z.time} (${tzNow()}):`);for(const p of c.tr.planets){let ing=null;try{if(!p.outer)ing=G.nextIngress(p.key,st.instant,{nodeMode:S.nodeMode})}catch(e){}L.push('- transit '+pl(p)+(ing?` — in this sign until ${G.utcToZoned(ing.date,tzNow()).date}`:''))}
    if(c.contacts.length)L.push('\nCLOSE CONTACTS (within '+S.orb+'°): '+c.contacts.map(x=>`transit ${gname(x.t)} on natal ${gname(x.n)} (${G.fmtDeg(x.d)})`).join('; ')+'.');
    const sel=st.sel;let focus='the overall gochara picture at this moment for this native';
    if(sel&&sel.type==='transit'){const p=c.tr.planets.find(x=>x.key===sel.key);if(p){const dr=G.drishtiTargets(p.key,p.house);focus=`transit ${p.en} (${p.name}) in ${G.RASHI_EN[p.sign]} ${G.fmtDeg(p.deg)}, ${p.nakName} pada ${p.pada}, in natal house ${p.house} counted from ${S.ref==='moon'?'the Moon':'the Lagna'}${dr.length?', casting graha drishti to house '+dr.map(x=>x.house+' ('+G.RASHI_EN[(ref+x.house-1)%12]+(natalChart.planets.filter(n=>n.house===x.house).length?' — natal '+natalChart.planets.filter(n=>n.house===x.house).map(n=>n.en).join(', ')+' there':'')+')').join(', '):''}${natalChart.planets.filter(n=>n.house===p.house).length?'; natal '+natalChart.planets.filter(n=>n.house===p.house).map(n=>n.en).join(', ')+' in that house':''}`}}
    else if(sel&&sel.type==='natal'){const n=natalChart.planets.find(x=>x.key===sel.key);if(n)focus=`natal ${n.en} in ${G.RASHI_EN[n.sign]}, house ${n.houseLagna} (${n.nakName} pada ${n.pada}) and the transits currently affecting it`}
    else if(sel&&sel.type==='house'){const h=G.houseFrom(sel.sign,ref);focus=`natal house ${h} (${G.RASHI_EN[sel.sign]}), its lord ${gname(G.SIGN_LORD[sel.sign])}, its occupants and the transits touching it now`}
    L.push(`\nPLEASE ANALYSE: ${focus}.${promptState.q?'\nSpecific question: '+promptState.q:''}`);
    const cats=(typeof CATEGORIES!=='undefined'?CATEGORIES:[]).map(x=>x[1]);
    L.push(`\nWrite for this chart specifically — name the houses, lords, occupants and dasha lords involved and say which factors strengthen or soften the effect. Use calibrated language ("may", "tends to"); never present outcomes as certain. Answer directly and completely, without disclaimers or referrals elsewhere.
Work out the period yourself from the transit(s) in focus — sign/house entry and exit dates (the "in this sign until" dates above), stations, exact contacts and the dasha sub-period boundaries — and give real calendar dates.
Approved categories (use these exact names): ${cats.join('; ')}.

Respond in exactly this format — keep the labels, fill in the brackets, plain text:

[1–3 WORD SIGNPOST TITLE]

Dates: [start date – end date]

Duration: [number of days or approximate duration]

Polarity: [Supportive / Mixed / Danger]

Intensity: [1–5]

Especially significant: [Yes / No]

Primary category: [choose exactly one approved category]

Secondary categories: [zero to three approved categories]

Prediction summary:
[1–3 concise sentences describing what this period may concretely indicate for this native.]

Why this period matters:
[Brief Jyotiṣa reasoning. Identify the activated houses, their lords, natal occupants, daśā lords and relevant transit contacts. Explain what strengthens or softens the effect.]

Supportive expression:
[What may go well, become easier, open up or become productive.]

Challenging expression:
[What may become difficult, excessive, delayed, unstable or vulnerable to poor judgment.]

Peak dates:
[Exact dates or narrow trigger windows where relevant.]

Consider

* […]
* […]
* […]

Suggestions

* […]
* […]
* […]

Consider postponing

* […]
* […]
* […]

After the template, add one closing section headed "BPL perspective": a synthesis of how Barbara Pijan Lama characteristically reads the placements involved (her bhava/graha/drishti framing and the psychological texture she gives each graha in each rashi and bhava), paraphrased in your own words and marked as a synthesis of her published approach${promptState.bpl.length?', drawing on these passages from her site (paraphrase, do not quote):\n- '+promptState.bpl.join('\n- '):''}.`);
    return L.join('\n')}
  function promptPanel(c){const sel=st.sel;const what=sel?(sel.type==='transit'?'this transit':sel.type==='natal'?'this natal placement':'this house'):'the current gochara';
    return `<div class="g-ai"><h4>Ask an AI about ${what}</h4>
     <div class="row" style="gap:6px"><input type="text" id="pr-q" placeholder="optional: a specific question (e.g. career move in November?)" value="${esc(promptState.q||'')}" style="flex:1;min-width:200px"><button type="button" class="btn small" id="pr-gen">Generate prompt</button></div>
     ${promptState.text?`<div class="row" style="gap:6px;margin-top:8px"><button type="button" class="btn small" id="pr-copy">Copy prompt</button><button type="button" class="btn ghost small" id="pr-bpl" ${promptState.busy?'disabled':''}>${promptState.busy?'Fetching BPL passages…':promptState.bpl.length?'BPL passages included ('+promptState.bpl.length+')':'Add BPL passages to the prompt'}</button><span class="small muted">${promptState.text.length.toLocaleString()} characters</span></div>

  async function addBplToPrompt(c){promptState.busy=true;draw();const notes=[];

  const addBtn=p=>opts.onAdd?`<p><button type="button" class="btn small" id="g-add">${opts.addLabel||'Add influence from this moment'}</button></p>`:'';

  function snapshot(c){const z=G.utcToZoned(st.instant,tzNow());const p=st.sel&&st.sel.type==='transit'?c.tr.planets.find(x=>x.key===st.sel.key):null;
    const d=c.dasha;const text=[`${z.date} ${z.time} ${tzNow()} · ayanamsa ${G.fmtDeg(c.tr.ayan)} (Lahiri)`,
      p?`Transit ${gname(p.key)} ${G.RASHI[p.sign]} ${G.fmtDeg(p.deg)} (${p.nakName} p${p.pada}${p.retro&&p.key!=='rahu'&&p.key!=='ketu'?', R':''}) — ${p.houseLagna}H from Lagna, ${p.houseMoon}H from Chandra; drishti to ${G.drishtiTargets(p.key,p.house).map(x=>x.house+'H').join(', ')||'none'}`:'',
      ...c.contacts.filter(x=>!p||x.t===p.key).map(x=>`Contact: transit ${gname(x.t)} within ${G.fmtDeg(x.d)} of natal ${gname(x.n)}`),
      d?`Dasha: ${gname(d.maha.lord)} / ${d.antar?gname(d.antar.lord):'—'} / ${d.pratyantar?gname(d.pratyantar.lord):'—'} / ${d.sookshma?gname(d.sookshma.lord):'—'}`:''].filter(Boolean).join('\n');
    return {text,local:z,tz:tzNow(),instant:st.instant.toISOString(),json:{instant:st.instant.toISOString(),tz:tzNow(),ref:S.ref,nodeMode:S.nodeMode,ayan:c.tr.ayan,source:c.tr.source,selected:p?{key:p.key,lon:p.lon,sign:p.sign,deg:p.deg,house:p.house,houseLagna:p.houseLagna,houseMoon:p.houseMoon}:null,transits:c.tr.planets.map(q=>({key:q.key,lon:+q.lon.toFixed(4),retro:q.retro})),dasha:d?{maha:d.maha.lord,antar:d.antar&&d.antar.lord,pratyantar:d.pratyantar&&d.pratyantar.lord,sookshma:d.sookshma&&d.sookshma.lord}:null,contacts:c.contacts}}}

  function draw(){const c=compute();const hi=highlights(c);const z=G.utcToZoned(st.instant,tzNow());
    const natalModel={refSign:natalRefSign(),planets:natalChart.planets};const trModel={refSign:c.ref,planets:c.tr.planets};
    const refWord={lagna:'from Lagna',moon:'from Chandra',sky:'from the sky Lagna'}[S.ref];
    const d=c.dasha;const per=(lbl,p)=>p?`<span><b>${lbl}</b> ${gname(p.lord)} <span class="muted">${G.utcToZoned(p.start,tzNow()).date} → ${G.utcToZoned(p.end,tzNow()).date}</span></span>`:`<span><b>${lbl}</b> —</span>`;
    const dstr=d?per('Mahadasha',d.maha)+per('Antardasha',d.antar)+per('Pratyantardasha',d.pratyantar)+per('Sookshma',d.sookshma):'';
    el.innerHTML=`<div class="goch ${st.compact?'compact':''}">
     ${natal.warn.length?`<p class="warn small">${natal.warn.map(esc).join(' ')}${natalAsc?'':(client.birth_location&&opts.onGeocode?` <button type="button" class="btn small" id="g-geo">Find birth place for “${esc(client.birth_location)}”</button>`:' <em>Enter the birth location on the Client &amp; access tab and save.</em>')}</p>`:''}
     ${natalTable()}
     <div class="g-time">
      <div class="row" style="gap:6px"><input type="date" id="g-date" value="${z.date}" min="1800-01-01" max="2050-12-31"><input type="time" id="g-clock" value="${z.time}"><span class="tag" title="Time zone in use">${esc(tzNow())} · ${G.fmtOffset(z.offset)}</span>
       <button type="button" class="btn small ${st.live?'':'ghost'}" id="g-now">Now</button></div>
      <div class="row" style="gap:4px;margin-top:6px"><button type="button" class="btn ghost small" data-step="-24">−day</button><button type="button" class="btn ghost small" data-step="-1">−hour</button><button type="button" class="btn ghost small" data-step="1">+hour</button><button type="button" class="btn ghost small" data-step="24">+day</button><button type="button" class="btn ghost small" data-step="168">+week</button><button type="button" class="btn ghost small" data-step="730.5">+month</button>
       <span class="seg" style="margin-left:auto">${Object.keys(SCALES).map(k=>`<button type="button" data-scale="${k}" aria-pressed="${S.scale===k}">${k}</button>`).join('')}</span></div>
      <input type="range" id="g-slider" min="-100" max="100" value="0" step="1" aria-label="Timeline (${SCALES[S.scale].label})"><div class="small muted" style="text-align:center;margin-top:-4px">${SCALES[S.scale].label} · release to re-centre</div>
     </div>
     <div class="row between" style="margin:10px 0 6px;gap:8px">
      <span class="seg"><button type="button" data-style="north" aria-pressed="${S.style==='north'}">North Indian</button><button type="button" data-style="south" aria-pressed="${S.style==='south'}">South Indian</button></span>
      <span class="row small" style="gap:10px"><label class="chk" style="margin:0"><input type="checkbox" id="g-outer" ${S.outer?'checked':''}>Uranus, Neptune, Pluto</label><label class="chk" style="margin:0"><input type="checkbox" id="g-node" ${S.nodeMode==='true'?'checked':''}>True nodes <span class="muted">(off = mean, as AstroSage)</span></label><label class="chk" style="margin:0">orb <select id="g-orb" style="width:auto;padding:2px 6px">${[0.5,1,2,3].map(o=>`<option ${S.orb===o?'selected':''}>${o}</option>`).join('')}</select>°</label><label class="chk" style="margin:0"><input type="checkbox" id="g-tz" ${S.tzMode==='mine'?'checked':''}>My time zone</label></span>
     </div>
     <div class="row between" style="margin:2px 0 8px"><span class="seg"><button type="button" data-gview="charts" aria-pressed="${st.view==='charts'}">Charts</button><button type="button" data-gview="planets" aria-pressed="${st.view==='planets'}">Planets ${st.live?'· live':''}</button><button type="button" data-gview="yogas" aria-pressed="${st.view==='yogas'}">Yogas &amp; doshas</button></span></div>
     ${st.view==='planets'?planetTable(c):st.view==='yogas'?yogaPanel():''}
     <div class="g-charts ${st.mobileView} ${st.view!=='charts'?'hidden':''}">
      <figure class="g-fig natal"><figcaption><span class="seg small"><button type="button" data-natalref="lagna" aria-pressed="${S.natalRef==='lagna'}" ${natalAsc?'':'disabled'}>Lagna</button><button type="button" data-natalref="moon" aria-pressed="${S.natalRef==='moon'}">Rasi (Chandra)</button></span><div class="cap">Natal · ${client.name?esc(client.name):''} <span class="muted">${natalAsc?'Lagna '+G.RASHI[natalLagnaSign]+' '+G.fmtDeg(natalAsc.sidereal%30):'Lagna unavailable'} · Chandra ${G.RASHI[natalMoon.sign]} ${G.fmtDeg(natalMoon.deg)}</span></div></figcaption>${render(natalModel,{style:S.style,highlight:hi.natal,cls:'natal',centreLabel:S.natalRef==='moon'?'Rasi':'Lagna'})}</figure>

      <div class="g-legend small muted"><span><i class="sw occ"></i> occupied by the selected graha</span><span><i class="sw dr"></i> receives its drishti</span><span><i class="sw tg"></i> natal graha under transit</span><span><i class="sw sel"></i> selected bhava</span><span><u>marked</u> natal graha affected · <u style="text-decoration-style:double">contact</u> within ${S.orb}°</span></div>

      ${c.tr.planets.map(p=>`<tr><td>${p.en}</td><td>tropical ${G.fmtDeg(p.tropical)} · sidereal ${G.fmtDeg(p.lon)} · ${G.RASHI[p.sign]} ${G.fmtDeg(p.deg)} · ${p.speed.toFixed(4)}°/d ${p.retro?'R':'D'}</td></tr>`).join('')}</tbody></table></details>
    </div>`;
    bind(c)}

  function setInstant(d,live){st.instant=d;st.live=!!live;draw()}
  function bind(c){
    $('#g-date',el).onchange=e=>{const t=$('#g-clock',el).value||'12:00';setInstant(G.zonedToUtc(e.target.value,t,tzNow()),false)};
    $('#g-clock',el).onchange=e=>{setInstant(G.zonedToUtc($('#g-date',el).value,e.target.value||'12:00',tzNow()),false)};
    $('#g-now',el).onclick=()=>setInstant(new Date(),true);
    el.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>setInstant(new Date(st.instant.getTime()+Number(b.dataset.step)*3600e3),false));
    el.querySelectorAll('[data-scale]').forEach(b=>b.onclick=()=>{S.scale=b.dataset.scale;saveSettings(S);draw()});
    el.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{S.ref=b.dataset.ref;saveSettings(S);draw()});

    el.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{S.style=b.dataset.style;saveSettings(S);draw()});
    el.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{st.mobileView=b.dataset.view;draw()});
    el.querySelectorAll('[data-gview]').forEach(b=>b.onclick=()=>{st.view=b.dataset.gview;draw()});
    $('#g-outer',el).onchange=e=>{S.outer=e.target.checked;saveSettings(S);rebuildNatal();draw()};
    $('#g-node',el).onchange=e=>{S.nodeMode=e.target.checked?'true':'mean';saveSettings(S);rebuildNatal();draw()};
    $('#g-orb',el).onchange=e=>{S.orb=Number(e.target.value);saveSettings(S);draw()};
    $('#g-tz',el).onchange=e=>{S.tzMode=e.target.checked?'mine':'client';saveSettings(S);draw()};
    const lat=$('#g-lat',el),lon=$('#g-lon',el);if(lat)lat.onchange=()=>{st.skyLat=Number(lat.value);draw()};if(lon)lon.onchange=()=>{st.skyLon=Number(lon.value);draw()};
    const sl=$('#g-slider',el);let raf=null;const anchor=st.instant.getTime();
    sl.oninput=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=null;st.instant=new Date(anchor+Number(sl.value)/10*SCALES[S.scale].unit);st.live=false;const c2=compute();const hi=highlights(c2);const z=G.utcToZoned(st.instant,tzNow());
      $('#g-date',el).value=z.date;$('#g-clock',el).value=z.time;$('.g-fig.transit .cap',el).innerHTML=`Gochara · ${z.date} ${z.time} <span class="muted">${{lagna:'from Lagna',moon:'from Chandra',sky:'from the sky Lagna'}[S.ref]}</span>`;const old=$('.g-fig.transit svg',el);if(old)old.outerHTML=render({refSign:c2.ref,planets:c2.tr.planets},{style:S.style,highlight:hi.transit,cls:'transit',centreLabel:'Gochara'})})};
    sl.onchange=()=>{if(raf){cancelAnimationFrame(raf);raf=null}st.instant=new Date(anchor+Number(sl.value)/10*SCALES[S.scale].unit);st.live=false;draw()};
    el.querySelectorAll('.kundli.transit [data-planet]').forEach(t=>t.onclick=()=>{st.sel={type:'transit',key:t.dataset.planet};draw()});
    el.querySelectorAll('.kundli.natal [data-planet]').forEach(t=>t.onclick=()=>{st.sel={type:'natal',key:t.dataset.planet};draw()});
    el.querySelectorAll('.kundli [data-house]').forEach(t=>t.onclick=()=>{st.sel={type:'house',sign:Number(t.dataset.sign)};draw()});
    el.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const [type,key]=b.dataset.pick.split(':');st.sel={type,key};draw()});
    const cl=$('#g-clear',el);if(cl)cl.onclick=()=>{st.sel=null;draw()};
    el.querySelectorAll('[data-rq]').forEach(b=>b.onclick=()=>runResearch(b.dataset.rq));
    const pg_=$('#pr-gen',el);if(pg_)pg_.onclick=()=>{promptState.q=$('#pr-q',el).value.trim();promptState.text=buildPrompt(c);draw();const ta=$('#pr-text',el);if(ta)ta.scrollIntoView({behavior:'smooth',block:'nearest'})};
    const pq=$('#pr-q',el);if(pq)pq.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();pg_.click()}};
    const pc=$('#pr-copy',el);if(pc)pc.onclick=()=>copy(promptState.text,'Prompt copied — paste it into ChatGPT or Claude');
    const pb=$('#pr-bpl',el);if(pb)pb.onclick=()=>addBplToPrompt(c);
    const pt=$('#pr-text',el);if(pt)pt.onclick=()=>pt.select();
    const rf=$('#g-rform',el);if(rf)rf.onsubmit=e=>{e.preventDefault();const q=$('#g-q',el).value.trim();if(q)runResearch(q)};
    const add=$('#g-add',el);if(add)add.onclick=()=>opts.onAdd(snapshot(c));
    const gg=$('#g-geo',el);if(gg)gg.onclick=()=>opts.onGeocode();
    if(timer)clearInterval(timer);if(st.live)timer=setInterval(()=>{if(!document.body.contains(el)){clearInterval(timer);return}if(st.live&&(!st.sel||st.view==='planets')){st.instant=new Date();draw()}},60000);
  }
  function rebuildNatal(){natalChart.planets=buildNatal().planets}
  const onEph=()=>{if(!document.body.contains(el)){window.removeEventListener('ephemeris-ready',onEph);return}rebuildNatal();draw()};window.addEventListener('ephemeris-ready',onEph);
  draw();
  return {setInstant,getSnapshot:()=>snapshot(compute()),destroy(){if(timer)clearInterval(timer);window.removeEventListener('ephemeris-ready',onEph);el.innerHTML=''}};
}
return {mount,renderNorthIndianChart,renderSouthIndianChart,render,natalFor};
})();

<script>
'use strict';
/* ---------------- Constants ---------------- */
const POLARITY={
  supportive:{label:'Supportive',alt:'Favourable window',color:'var(--supportive)',shape:'circle',hint:'opportunities, constructive momentum, helpful conditions'},

const CATEGORIES=[
  ['work','Work and vocation'],['money','Money and resources'],['relationships','Relationships'],['communication','Communication'],
  ['home','Home and family'],['health','Health and vitality'],['travel','Travel and movement'],['learning','Learning and study'],

function drawDay(pkg,visible,ds,root){

  const block=i=>{const p=POLARITY[i.polarity];const dur=i.start_date===i.end_date?fmtShort(i.start_date):`${fmtShort(i.start_date)} – ${fmtShort(i.end_date)}`;const parent=i.parent_id&&(pkg.influences||[]).find(x=>x.id===i.parent_id);

   return `<article class="inf ${i.polarity}" aria-label="${esc(i.accessibility_label||`${p.label}: ${CAT[i.category]||i.category}`)}">

    ${sec('What you may notice',i.observation_prompt)}

   </article>`};

/* ICS */
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m)}
function icsTitle(i){const cat=CAT[i.category]||'General';const p={supportive:'Supportive window',caution:'Allow extra care',mixed:'Variable conditions',especially_sensitive:'Important to review'}[i.polarity];return i.category==='rest'?'Rest and restoration period':`${p}: ${cat}`}
function buildICS(pkg,opts){
  const dt=s=>s.replace(/-/g,'');
  const addDay=s=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+1)).replace(/-/g,'')};
  const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Atelier Sonnentau//Calendar//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Atelier Sonnentau — '+icsEscape(pkg.name)];
  const list=(pkg.influences||[]).filter(i=>i.calendar_sync_enabled!==false).filter(i=>{
    if(opts.polarities.length&&!opts.polarities.includes(i.polarity)&&!(opts.significant&&i.significant))return false;
    if(opts.categories.length&&!opts.categories.includes(i.category))return false;return true});
  for(const i of list){
    out.push('BEGIN:VEVENT',`UID:${i.id}@sonnentau`,`DTSTAMP:${dt(todayStr())}T000000Z`);
    if(opts.exactTimes&&i.start_time){const tz=i.timezone||'UTC';out.push(`DTSTART;TZID=${tz}:${dt(i.start_date)}T${t5(i.start_time).replace(':','')}00`,`DTEND;TZID=${tz}:${dt(i.end_date)}T${t5(i.end_time||i.start_time).replace(':','')}00`)}
    else out.push(`DTSTART;VALUE=DATE:${dt(i.start_date)}`,`DTEND;VALUE=DATE:${addDay(i.end_date)}`);
    out.push(`SUMMARY:${icsEscape(icsTitle(i))}`);
    let desc=i.client_interpretation||'';if(opts.reminders&&i.recommended_actions)desc+='\n\nConsider: '+lines(i.recommended_actions).join('; ');
    out.push(`DESCRIPTION:${icsEscape(desc)}`,`CATEGORIES:${icsEscape(CAT[i.category]||'General')}`,'END:VEVENT');
  }
  out.push('END:VCALENDAR');return out.join('\r\n');
}

const fmtDur=ms=>{const m=Math.round(ms/60000);if(m<1)return 'under a minute';if(m<60)return m+' min';const h=Math.floor(m/60);return h+' h '+(m%60?(m%60)+' min':'')};

function analyseActivity(rows){const ev=rows.slice().sort((a,b)=>new Date(a.at)-new Date(b.at));const visits=[];let cur=null;

    if(!cur||e.session_id!==cur.sid||gap>10*60000||(cur.closed&&e.event==='open')){cur={sid:e.session_id,startT:t,endT:t,closed:false,screens:[],events:0,ua:e.user_agent};visits.push(cur)}

const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parseDateLoose(str,fallbackYear){const t=String(str||'').trim();let m;
  if((m=t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/)))return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  const mon=w=>{const i=MONTHS.indexOf(String(w).slice(0,3).toLowerCase());return i<0?null:i+1};
  if((m=t.match(/(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,})\.?,?\s*(\d{4})?/))&&mon(m[2]))return `${m[3]||fallbackYear||new Date().getFullYear()}-${String(mon(m[2])).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if((m=t.match(/([A-Za-z]{3,})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})?/))&&mon(m[1]))return `${m[3]||fallbackYear||new Date().getFullYear()}-${String(mon(m[1])).padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  return null}
function parseAIAnswer(text){const src=String(text||'').replace(/\r/g,'');const out={};const notes=[];
  const HEAD=['dates','duration','polarity','intensity','especially significant','primary category','secondary categories','prediction summary','why this period matters','supportive expression','challenging expression','peak dates','consider postponing','suggestions','consider','bpl perspective','what bpl may say'];
  const clean=l=>l.replace(/^[#>\s]+/,'').replace(/\*\*/g,'').replace(/^[\[\]]+|[\[\]]+$/g,'').trim();
  const lines=src.split('\n');const sections={};let cur=null;let title='';
  for(const raw of lines){const l=clean(raw);if(!l)continue;const low=l.toLowerCase();
    const h=HEAD.find(h=>low===h||low===h+':'||low.startsWith(h+':'));
    if(h){cur=h;sections[h]=sections[h]||[];const rest=l.slice(l.toLowerCase().indexOf(h)+h.length).replace(/^:\s*/,'').trim();if(rest)sections[h].push(rest);continue}
    if(!cur){if(!title&&!/^\[/.test(raw.trim()))title=l.replace(/^[\[\]]+|[\[\]]+$/g,'').trim();else if(!title)title=l;continue}
    sections[cur].push(l)}
  const joined=h=>(sections[h]||[]).join('\n').trim();
  const bullets=h=>(sections[h]||[]).map(x=>x.replace(/^[\*\-•·]\s*|^\d+[.)]\s*/,'').replace(/^[\[\]…]+|[\[\]…]+$/g,'').trim()).filter(x=>x&&!/^\[?…\]?$/.test(x));
  if(title&&title.length<=80)out.title=title.replace(/[.:]$/,'');
  const dates=joined('dates');if(dates){const parts=dates.split(/\s[–—-]\s|\s*[–—]\s*|\sto\s|\suntil\s/).map(x=>x.trim()).filter(Boolean);const y2=(parts[1]||'').match(/\d{4}/);let d1=parseDateLoose(parts[0],y2&&y2[0]),d2=parts[1]?parseDateLoose(parts[1],(d1||'').slice(0,4)):d1;
    if(!d1&&d2&&/^\d{1,2}$/.test(parts[0]))d1=d2.slice(0,8)+parts[0].padStart(2,'0'); // "12–14 October 2026"
    if(d1)out.start_date=d1;if(d2)out.end_date=d2;if(!d1)notes.push('dates not understood: “'+dates+'”')}
  const pol=joined('polarity').toLowerCase();const inten=parseInt((joined('intensity').match(/\d/)||[''])[0],10);if(inten>=1&&inten<=5)out.intensity=inten;
  if(/supportive/.test(pol))out.polarity='supportive';else if(/mixed/.test(pol))out.polarity='mixed';else if(/danger|caution|challeng|difficult/.test(pol))out.polarity=(out.intensity>=4?'especially_sensitive':'caution');
  const sig=joined('especially significant').toLowerCase();if(sig)out.significant=/^y|true/.test(sig);
  const catKey=label=>{const t=label.toLowerCase().replace(/[^a-z ]/g,'').trim();if(!t)return null;const hit=CATEGORIES.find(([k,l])=>l.toLowerCase()===t||k===t)||CATEGORIES.find(([k,l])=>l.toLowerCase().startsWith(t)||t.startsWith(l.toLowerCase().split(' ')[0]));return hit?hit[0]:null};
  const pc=joined('primary category');if(pc){const k=catKey(pc);if(k)out.category=k;else notes.push('category “'+pc+'” is not one of the approved categories')}
  const sc=joined('secondary categories');if(sc){out.secondary_categories=sc.split(/[,;\n\/]/).map(catKey).filter(Boolean).filter(k=>k!==out.category).slice(0,3)}
  const para=[joined('prediction summary'),joined('supportive expression')?'What may go well: '+joined('supportive expression'):'',joined('challenging expression')?'What may need care: '+joined('challenging expression'):'',joined('peak dates')?'Peak dates: '+joined('peak dates'):''].filter(Boolean);
  if(para.length)out.client_interpretation=para.join('\n\n');
  if(bullets('consider').length)out.reflection_prompt=bullets('consider').join('\n');
  if(bullets('suggestions').length)out.recommended_actions=bullets('suggestions').join('\n');
  if(bullets('consider postponing').length)out.avoidances=bullets('consider postponing').join('\n');
  const priv=[joined('why this period matters')?'Why this period matters:\n'+joined('why this period matters'):'',joined('bpl perspective')||joined('what bpl may say')?'BPL perspective:\n'+(joined('bpl perspective')||joined('what bpl may say')):''].filter(Boolean);
  if(priv.length)out.private_notes=priv.join('\n\n');
  if(joined('why this period matters'))out.technical_basis=joined('why this period matters').split(/(?<=[.!?])\s/)[0].slice(0,160);

function fillFromAI(form,text){const {fields,notes}=parseAIAnswer(text);const filled=[];
  for(const [k,v] of Object.entries(fields)){

    if(k==='private_notes'&&el.value.trim()){el.value=el.value.trimEnd()+'\n\n'+v}else el.value=v;filled.push(k.replace(/_/g,' '))}
  form.dispatchEvent(new Event('input'));return {filled,notes,fields}}

  let gws=null;const gt=$('#gtoggle',dlg);
  gt.onclick=()=>{const on=gt.getAttribute('aria-pressed')!=='true';gt.setAttribute('aria-pressed',on);dlg.classList.toggle('wide',on);$('.db',dlg).classList.toggle('split',on);$('#gpane',dlg).classList.toggle('hidden',!on);
    if(on&&!gws){const f=$('#ef',dlg);const tz=c.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone;const when=GOCHARA.zonedToUtc(f.elements.start_date.value||todayStr(),f.elements.start_time.value||'12:00',tz);
      gws=GUI.mount($('#gpane',dlg),c,{compact:true,instant:when,addLabel:'Use this moment in the influence',onAdd:snap=>{f.elements.start_date.value=snap.local.date;if(f.elements.end_date.value<snap.local.date)f.elements.end_date.value=snap.local.date;f.elements.start_time.value=snap.local.time;f.elements.timezone.value=snap.tz;
        const pn=f.elements.private_notes;pn.value=(pn.value?pn.value.trimEnd()+'\n\n':'')+snap.text;inf.transit_snapshot=snap.json;const p=snap.json.selected;if(p&&!f.elements.technical_basis.value)f.elements.technical_basis.value=`Transit ${GOCHARA.GRAHA.find(g=>g.key===p.key).name} ${GOCHARA.RASHI[p.sign]} ${Math.floor(p.deg)}° — ${p.houseLagna}H from Lagna, ${p.houseMoon}H from Chandra`;toast('Moment copied into the influence');f.dispatchEvent(new Event('input'))}});}};
  dlg.addEventListener('close',()=>{if(gws)gws.destroy()});
  const form=$('#ef',dlg);
  $('#aifill',dlg).onclick=()=>{$('#aibox',dlg).classList.toggle('hidden');$('#aitext',dlg).focus()};$('#aicancel',dlg).onclick=()=>$('#aibox',dlg).classList.add('hidden');
  $('#aiapply',dlg).onclick=()=>{const t=$('#aitext',dlg).value;if(!t.trim())return;const r=fillFromAI(form,t);if(!r.filled.length){$('#ainote',dlg).textContent='Nothing recognised — the answer should use the headings from the prompt (Dates, Polarity, Prediction summary…).';return}
    $('#ainote',dlg).innerHTML=`Filled: ${esc(r.filled.join(', '))}.${r.notes.length?' <span style="color:var(--sensitive)">'+esc(r.notes.join(' · '))+'</span>':''}${r.fields.polarity&&/caution|especially/.test(r.fields.polarity)?' “Danger” was mapped to '+esc(POLARITY[r.fields.polarity].label)+' — adjust if needed.':''}`;toast('Form filled from the AI answer — please review it')};
  const collect=()=>{const f=new FormData(form);const o={};const j=inf.jyotish||{},s=inf.source_reference||{};const secs=[],sup=[],dif=[];
    for(const [k,v] of f){if(k==='sec')secs.push(v);else if(k==='sup')sup.push(v);else if(k==='dif')dif.push(v);else if(k.startsWith('j:'))j[k.slice(2)]=v;else if(k.startsWith('s:'))s[k.slice(2)]=v;else o[k]=v}
    o.supportive_for=o.polarity==='mixed'?sup:[];o.difficult_for=o.polarity==='mixed'?dif:[];
    for(const cb of ['significant','show_exact_time','show_technical_basis','calendar_sync_enabled'])o[cb]=form.elements[cb].checked;o.prediction='';o.show_prediction=true;
    o.intensity=o.intensity===''?'':Math.min(5,Math.max(1,Number(o.intensity)||1));o.secondary_categories=secs.filter(x=>x!==o.category);o.jyotish=j;o.source_reference=s;o.transit_snapshot=inf.transit_snapshot||null;o.parent_id=o.parent_id||null;
    o.start_date=fixYear(o.start_date);o.end_date=fixYear(o.end_date);
    if(o.end_date<o.start_date)o.end_date=o.start_date;return o};
  const datesOk=()=>{const o=collect();if(!yearOk(o.start_date)||!yearOk(o.end_date)){alert(`The year in the dates looks wrong (${yearOf(o.start_date)}). Please enter a four-digit year such as ${new Date().getFullYear()}.`);return false}return true};
  const updateSig=()=>{const o=collect();const p=POLARITY[o.polarity];$('#sigpreview',dlg).innerHTML=`Marker: ${icon(p.shape,p.color)} <strong>${p.label}</strong> · ${p.hint}${o.category?` · Category accent <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cat-${o.category})"></span> ${esc(CAT[o.category])}`:' · <em>choose a category</em>'}${o.significant?' · '+icon('star','var(--significant)')+' significant':''}${o.category==='remedies'?' · <em>visible only to clients with the remedial add-on</em>':''}`};
  form.addEventListener('input',()=>{updateSig();$('#mixedareas',dlg).classList.toggle('hidden',form.elements.polarity.value!=='mixed')});updateSig();
  const review=()=>{const o=collect();const fields={Title:o.title,Interpretation:o.client_interpretation,Notice:o.observation_prompt,Consider:o.reflection_prompt,Act:o.recommended_actions,Postpone:o.avoidances,Remedial:o.remedial_note};
    const hits=Object.entries(fields).map(([k,v])=>[k,langCheck(v)]).filter(([,h])=>h.length);
    const missing=[];if(!o.client_interpretation)missing.push('an interpretation');if(o.category==='health'&&!['health','custom'].includes(o.disclaimer))missing.push('a health boundary disclaimer');if(o.category==='legal'&&!['legal','custom'].includes(o.disclaimer))missing.push('a legal disclaimer');if(o.category==='money'&&!['financial','custom'].includes(o.disclaimer))missing.push('a financial disclaimer');if((o.category==='remedies'||o.remedial_note)&&!['remedy','custom'].includes(o.disclaimer))missing.push('the remedy disclaimer');
    if(o.polarity==='especially_sensitive'&&!o.reflection_prompt)missing.push('a reflection prompt (recommended for especially sensitive periods)');
    const p=POLARITY[o.polarity];
    $('#review',dlg).innerHTML=`<div class="card" style="background:var(--surface-2);box-shadow:none"><h3>Pre-publication review</h3>
     <div class="row"><span class="pill ${o.polarity}">${icon(p.shape,p.color,12)} ${p.label}</span>${o.significant?`<span class="pill significant">Especially significant</span>`:''}<span class="tag">${esc(CAT[o.category])}</span><span class="tag">Intensity ${o.intensity}</span><span class="tag">token: ${o.polarity} / ${p.shape}</span><span class="tag">aria: ${esc(o.accessibility_label||`${p.label}: ${CAT[o.category]}`)}</span></div>
     ${hits.length?`<div class="warn" style="margin-top:8px"><strong>Language check:</strong> possibly deterministic or alarmist wording — ${hits.map(([k,h])=>`${k}: “${h.map(esc).join('”, “')}”`).join('; ')}. Consider softening (“may”, “consider”, “allow extra care”).</div>`:`<div class="ok" style="margin-top:8px">Language check: no deterministic or alarmist phrases detected.</div>`}
     ${missing.length?`<div class="warn" style="margin-top:8px">Consider adding ${missing.join(', ')}.</div>`:''}
     <h4 style="margin-top:12px">Client will see</h4><div id="pvblock"></div>
     <p class="row"><button class="btn" type="button" id="confirmpub">Publish now</button><button class="btn ghost" type="button" id="backedit">Keep editing</button></p></div>`;
    const proj={...o,id:inf.id,supportive_for:o.supportive_for,difficult_for:o.difficult_for,start_time:o.show_exact_time?o.start_time:'',end_time:o.show_exact_time?o.end_time:'',prediction:'',technical_basis:o.show_technical_basis?o.technical_basis:'',custom_disclaimer:o.disclaimer==='custom'?o.custom_disclaimer:''};
    const stub=document.createElement('div');stub.innerHTML='<div id="daypanel"></div>';drawDay({influences:[proj],default_disclaimer:'none'},[proj],o.start_date,stub);$('#pvblock',dlg).innerHTML=stub.querySelector('.inf')?.outerHTML||'';
    $('#review',dlg).scrollIntoView({behavior:'smooth'});
    $('#confirmpub',dlg).onclick=()=>persist(true,'Published');$('#backedit',dlg).onclick=()=>{$('#review',dlg).innerHTML=''}};
  const busy=on=>dlg.querySelectorAll('button').forEach(b=>b.disabled=on);
  const persist=async(pub,msg)=>{busy(true);try{const o={...inf,...collect(),published:pub};await api.saveInfluence(o);dlg.close();dlg.remove();toast(msg);ctx.reload()}catch(e){busy(false);alert('Could not save: '+e.message)}};
  $('#savedraft',dlg).onclick=()=>{if(!form.reportValidity()||!datesOk())return;persist(false,'Draft saved — not visible to the client until published')};
  $('#publish',dlg).onclick=()=>{if(!form.reportValidity()||!datesOk())return;review()};
  const un=$('#unpub',dlg);if(un)un.onclick=()=>persist(false,'Unpublished');
  $('#astemplate',dlg).onclick=guard(async()=>{const o=collect();const name=prompt('Template name:',o.title);if(!name)return;const data={};for(const k of ['category','polarity','intensity','client_interpretation','observation_prompt','reflection_prompt','recommended_actions','avoidances','disclaimer','remedial_note','private_notes'])data[k]=o[k];await api.saveTemplate({id:uuid(),name,data});toast('Template saved');ctx.templates=await api.listTemplates()});
  const del=$('#del',dlg);if(del)del.onclick=guard(async()=>{if(confirm('Delete this influence? Windows within it will be kept but unlinked.')){busy(true);try{await api.deleteInfluence(inf.id)}catch(e){busy(false);throw e}dlg.close();dlg.remove();ctx.reload()}});
  $('#close',dlg).onclick=()=>{dlg.close();dlg.remove()};
  dlg.addEventListener('cancel',()=>dlg.remove());
}

/* ---------------- Templates ---------------- */
async function renderTemplates(){
  const templates=await api.listTemplates();
  app.innerHTML=`<p class="crumbs"><a href="#/admin">Clients</a> › Templates</p><div class="row between" style="margin-bottom:14px"><h1 style="margin:0">Templates</h1><div class="row">${templates.length?'':'<button type="button" class="btn ghost" id="starter">Add starter templates</button>'}<button type="button" class="btn" id="newt">New template</button></div></div>
   <div class="card"><ul class="list">${templates.map(t=>{const d=t.data||{};const p=POLARITY[d.polarity]||POLARITY.supportive;return `<li><div><a href="#/admin/templates" data-e="${t.id}">${esc(t.name)}</a><div class="small muted">${icon(p.shape,p.color)} ${p.label} · ${esc(CAT[d.category]||d.category||'General')} · intensity ${d.intensity||3}</div></div><div class="row"><button type="button" class="btn ghost small" data-e="${t.id}">Edit</button><button type="button" class="btn quiet small" data-d="${t.id}">Delete</button></div></li>`}).join('')||'<li class="muted">No templates yet.</li>'}</ul></div>`;
  const edit=t=>{const d=t.data||{};const dlg=document.createElement('dialog');
    dlg.innerHTML=`<div class="dh"><h2 style="margin:0">Template</h2><button type="button" class="btn quiet small" id="x" aria-label="Close">✕</button></div><div class="db"><form id="tf">${fld('Name','name',t.name,'text','required')}
     <div class="grid3"><label class="f"><span>Default polarity</span>${sel('polarity',Object.entries(POLARITY).map(([k,p])=>[k,p.label]),d.polarity||'supportive')}</label><label class="f"><span>Default category</span>${sel('category',CATEGORIES,d.category||'general')}</label><label class="f"><span>Default intensity</span><input type="number" name="intensity" min="1" max="5" value="${d.intensity||3}"></label></div>
     ${txt('Interpretation','client_interpretation',d.client_interpretation)}${txt('Notice prompt','observation_prompt',d.observation_prompt)}${txt('Consider prompt','reflection_prompt',d.reflection_prompt)}${txt('Act prompt','recommended_actions',d.recommended_actions)}${txt('Caution / postpone language','avoidances',d.avoidances)}${txt('Remedial note','remedial_note',d.remedial_note)}
     <label class="f"><span>Default disclaimer</span>${sel('disclaimer',Object.keys(DISCLAIMERS).map(k=>[k,k]),d.disclaimer||'none')}</label>${txt('Private Jyotish rationale','private_notes',d.private_notes)}
     <p><button class="btn" type="submit">Save template</button></p></form></div>`;
    document.body.appendChild(dlg);dlg.showModal();$('#x',dlg).onclick=()=>{dlg.close();dlg.remove()};dlg.addEventListener('cancel',()=>dlg.remove());
    $('#tf',dlg).onsubmit=guard(async e=>{e.preventDefault();const data={};let name='';for(const [k,v] of new FormData(e.target)){if(k==='name')name=v;else data[k]=k==='intensity'?Number(v):v}await api.saveTemplate({id:t.id||uuid(),name,data});dlg.close();dlg.remove();toast('Template saved');renderTemplates()})};
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=e=>{e.preventDefault();edit(templates.find(t=>t.id===b.dataset.e))});
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=guard(async()=>{if(confirm('Delete this template?')){await api.deleteTemplate(b.dataset.d);renderTemplates()}}));
  $('#newt').onclick=()=>edit({name:'',data:{}});
  const st=$('#starter');if(st)st.onclick=guard(async()=>{st.disabled=true;try{for(const t of STARTER_TEMPLATES)await api.saveTemplate({id:uuid(),name:t.name,data:t.data})}catch(e){st.disabled=false;throw e}toast('Starter templates added');renderTemplates()});
}

/* ---------------- Boot ---------------- */
route();
</script>
</body>
</html>
